<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#0b1668">
<meta name="referrer" content="strict-origin-when-cross-origin">
<title>따라 불러</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Black+Han+Sans&family=IBM+Plex+Sans+KR:wght@400;600&display=swap">
<script src="https://accounts.google.com/gsi/client" async defer></script>
<style>
/* Layout: a noraebang monitor. Cobalt screen, lyrics wipe yellow as they are sung, score screen at the end. */
:root{
  color-scheme:dark;
  --screen:#0b1668; --panel:#14218a; --edge:#3142b8; --ink:#f7f8ff; --dim:#b9c1f2;
  --wipe:#ffe14a; --hot:#ff7ab8; --good:#4fe3b0; --bad:#ff8f8f; --shadow:#050a3a;
  --display:"Black Han Sans","IBM Plex Sans KR","Apple SD Gothic Neo","Malgun Gothic",sans-serif;
  --body:"IBM Plex Sans KR","Apple SD Gothic Neo","Malgun Gothic",system-ui,sans-serif;
}
*{box-sizing:border-box}
html,body{background:var(--screen);color:var(--ink)}
body{font:16px/1.55 var(--body);-webkit-text-size-adjust:100%}
button,select,input,textarea{font:inherit;color:inherit}
button{cursor:pointer;background:none;border:0;padding:0}
:focus-visible{outline:2px solid var(--wipe);outline-offset:2px}
.app{max-width:720px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:16px 96px;display:flex;flex-direction:column;gap:20px}
h1,h2,h3{font-family:var(--display);font-weight:400;margin:0;text-wrap:balance;line-height:1.2}
h1{font-size:30px}h2{font-size:22px}h3{font-size:18px}
p{margin:0}
.muted{color:var(--dim);font-size:14px}
.top{display:flex;align-items:baseline;justify-content:space-between;gap:12px;flex-wrap:wrap}
.btn{padding:10px 16px;border:1.5px solid var(--edge);border-radius:6px;background:var(--panel);min-height:44px}
.btn.primary{background:var(--wipe);color:#141a5e;border-color:var(--wipe);font-weight:600}
.btn[aria-pressed="true"]{background:var(--ink);color:var(--screen);border-color:var(--ink)}
.btn:disabled{opacity:.5;cursor:default}
.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.link{color:var(--wipe);text-decoration:underline;text-underline-offset:3px}

/* Karaoke text */
.kara{font-family:var(--display);color:var(--ink);text-shadow:2px 2px 0 var(--shadow),-1px -1px 0 var(--shadow),1px -1px 0 var(--shadow),-1px 1px 0 var(--shadow);letter-spacing:.01em}
.kara .sy{transition:color .1s linear}
.kara .sy.on{color:var(--wipe)}
.hero{padding:22px 16px;border:2px solid var(--edge);border-radius:6px;background:var(--panel);text-align:center;display:flex;flex-direction:column;gap:6px}
.hero .kara{font-size:clamp(26px,7.5vw,40px)}
@media (prefers-reduced-motion:no-preference){
  .hero .sy{animation:fill 7s linear infinite;animation-delay:calc(var(--n)*.3s)}
}
@keyframes fill{0%{color:var(--ink)}3%,72%{color:var(--wipe)}80%,100%{color:var(--ink)}}

/* Song list */
.songs{display:flex;flex-direction:column}
.song{display:grid;grid-template-columns:1fr auto;gap:2px 12px;padding:14px 0;border-top:1px solid var(--edge);text-align:left;width:100%}
.song:last-child{border-bottom:1px solid var(--edge)}
.song h3{font-size:21px;min-width:0}
.song .meta{grid-column:1;min-width:0;overflow-wrap:anywhere}
.song .go{grid-row:1/3;grid-column:2;align-self:center;color:var(--wipe);font-size:22px}

/* Stage */
.tabs{display:flex;gap:4px;border-bottom:2px solid var(--edge)}
.tabs button{padding:10px 14px;margin-bottom:-2px;border-bottom:3px solid transparent;color:var(--dim);min-height:44px}
.tabs button[aria-selected="true"]{color:var(--ink);border-bottom-color:var(--wipe);font-weight:600}
.stage{padding:24px 14px;background:var(--panel);border:2px solid var(--edge);border-radius:6px;text-align:center;display:flex;flex-direction:column;gap:14px;min-width:0}
.stage .count{font-size:13px;color:var(--dim);font-variant-numeric:tabular-nums}
.stage .kara.now{font-size:clamp(24px,6.6vw,38px);line-height:1.45}
.stage .w{display:inline;border-radius:4px;padding:0 2px;font:inherit;color:inherit;text-shadow:inherit;letter-spacing:inherit}
.stage .w:hover{background:rgba(255,255,255,.1)}
.stage .next{font-family:var(--display);font-size:clamp(15px,4vw,20px);color:var(--dim)}
.turn{height:6px;border-radius:3px;background:var(--edge);overflow:hidden}
.turn i{display:block;height:100%;width:0;background:var(--hot)}
.turnlabel{font-size:14px;color:var(--hot);font-weight:600;min-height:21px}
.say{display:flex;flex-direction:column;gap:6px;padding-top:12px;border-top:1px dashed var(--edge)}
.say .surf{font-size:21px;font-weight:600}
.say .surf b{color:var(--hot);font-weight:600}
.say .rom{color:var(--dim);font-size:15px}
.rules{display:flex;flex-direction:column;gap:4px;text-align:left;font-size:14px;color:var(--dim)}
.rules b{color:var(--ink);font-weight:600}
.en{color:var(--ink);font-size:16px}
.ctrl{display:flex;flex-direction:column;gap:10px}
.play{display:grid;grid-template-columns:1fr 2fr 1fr;gap:8px}
.sheetlist{display:flex;flex-direction:column}
.sheetlist button{display:block;width:100%;padding:9px 4px;text-align:left;border-top:1px solid var(--edge);color:var(--dim);overflow-wrap:anywhere}
.sheetlist button[aria-current="true"]{color:var(--wipe);font-weight:600}
label.field{display:flex;flex-direction:column;gap:4px;font-size:14px;color:var(--dim)}
input[type=text],textarea,select{background:var(--panel);border:1.5px solid var(--edge);border-radius:6px;padding:10px;color:var(--ink);width:100%;min-height:44px}
textarea{min-height:200px;font-size:16px;line-height:1.6}
select{width:auto}
.block{display:flex;flex-direction:column;gap:10px;padding-top:16px;border-top:1px solid var(--edge)}

/* Words */
.wlist{display:flex;flex-direction:column}
.wrow{display:grid;grid-template-columns:1fr auto;gap:8px;align-items:center;padding:10px 0;border-top:1px solid var(--edge)}
.wrow>button:first-child{text-align:left;min-width:0}
.wrow .ko{font-size:18px;font-weight:600}
.wrow .gl{display:block;color:var(--dim);font-size:14px;overflow-wrap:anywhere}
.add{min-width:64px;min-height:40px;padding:6px 10px;border:1.5px solid var(--edge);border-radius:6px;font-size:14px}
.add[disabled]{color:var(--good);border-color:transparent;cursor:default}

/* Review and gap fill */
.card{padding:26px 16px;background:var(--panel);border:2px solid var(--edge);border-radius:6px;text-align:center;display:flex;flex-direction:column;gap:12px;min-width:0}
.card .big{font-family:var(--display);font-size:38px;line-height:1.2;overflow-wrap:anywhere}
.card .ctx{color:var(--dim);overflow-wrap:anywhere}
.card .ctx mark{background:none;color:var(--wipe);font-weight:600}
.rate{display:grid;grid-template-columns:repeat(4,1fr);gap:6px}
.rate button{padding:8px 2px;border:1.5px solid var(--edge);border-radius:6px;background:var(--panel);min-height:56px;font-size:14px;display:flex;flex-direction:column;align-items:center;justify-content:center}
.rate small{color:var(--dim);font-variant-numeric:tabular-nums}
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;text-align:center}
.stats div{display:flex;flex-direction:column}
.stats b{font-family:var(--display);font-weight:400;font-size:26px;font-variant-numeric:tabular-nums}
.stats span{font-size:13px;color:var(--dim)}
.opts{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.opts button{padding:12px 6px;border:1.5px solid var(--edge);border-radius:6px;background:var(--panel);font-size:18px;min-height:52px;overflow-wrap:anywhere}
.opts button.ok{border-color:var(--good);color:var(--good)}
.opts button.no{border-color:var(--bad);color:var(--bad)}
.blank{color:var(--wipe);border-bottom:3px solid var(--wipe);padding:0 10px}
.score{font-family:var(--display);font-size:92px;line-height:1;color:var(--wipe);text-shadow:3px 3px 0 var(--shadow);font-variant-numeric:tabular-nums}
.score small{font-size:34px}

/* Chrome */
nav.bar{position:fixed;left:0;right:0;bottom:0;z-index:5;display:grid;grid-template-columns:repeat(3,1fr);background:var(--shadow);border-top:2px solid var(--edge);padding-bottom:env(safe-area-inset-bottom,0px);padding-left:max(0px,env(safe-area-inset-left,0px));padding-right:max(0px,env(safe-area-inset-right,0px))}
nav.bar button{padding:13px 4px;color:var(--dim);font-size:15px;min-height:52px}
nav.bar button[aria-current="true"]{color:var(--wipe);font-weight:600}
.badge{display:inline-block;min-width:20px;padding:0 5px;margin-left:4px;border-radius:10px;background:var(--hot);color:#141a5e;font-size:13px;font-weight:600}
#veil{position:fixed;inset:0;background:rgba(5,10,58,.7);z-index:9}
#sheet{position:fixed;left:0;right:0;bottom:0;z-index:10;max-height:85%;overflow:auto;background:var(--panel);border-top:3px solid var(--wipe);padding-block:18px calc(18px + env(safe-area-inset-bottom,0px));padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
#sheet .in{max-width:640px;margin:0 auto;display:flex;flex-direction:column;gap:10px}
#toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(68px + env(safe-area-inset-bottom,0px));z-index:12;width:min(92%,480px);padding:10px 14px;background:var(--ink);color:var(--screen);border-radius:6px;font-size:14px}

/* YouTube additions */
.video{position:sticky;top:env(safe-area-inset-top,0px);z-index:4;aspect-ratio:16/9;width:100%;max-width:100%;background:#000;border:2px solid var(--edge);border-radius:6px;overflow:hidden}
.video iframe,.video #ythost{display:block;width:100%;height:100%;border:0}
.vids{display:flex;flex-direction:column}
.vid{display:grid;grid-template-columns:120px 1fr;gap:12px;align-items:center;padding:10px 0;border-top:1px solid var(--edge);text-align:left;width:100%}
.vid.static{border:0;padding:0}
.vid img{width:120px;aspect-ratio:16/9;object-fit:cover;border-radius:4px;display:block}
.vt{display:flex;flex-direction:column;min-width:0;overflow-wrap:anywhere}
.vt b{font-weight:600}
#found{display:flex;flex-direction:column;gap:10px}
#markbar{position:fixed;left:0;right:0;bottom:0;z-index:8;background:var(--panel);border-top:3px solid var(--wipe);padding-block:14px calc(14px + env(safe-area-inset-bottom,0px));padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
#markbar .in{max-width:640px;margin:0 auto;display:flex;flex-direction:column;gap:8px}
.markline{font-family:var(--display);font-size:22px;overflow-wrap:anywhere}

[hidden]{display:none!important}
html,body{margin:0}
img{max-width:100%}
</style>
</head>
<body>
<div class="app" id="app"></div>
<nav class="bar" id="bar" aria-label="Main"></nav>
<div id="markbar" hidden></div>
<div id="veil" hidden></div>
<div id="sheet" role="dialog" aria-modal="true" aria-label="Details" hidden></div>
<div id="toast" role="status" hidden></div>
<script>

// Korean pronunciation engine: applies the standard sound-change rules to written Hangul.
const CH='ㄱㄲㄴㄷㄸㄹㅁㅂㅃㅅㅆㅇㅈㅉㅊㅋㅌㅍㅎ'.split('');
const JU='ㅏㅐㅑㅒㅓㅔㅕㅖㅗㅘㅙㅚㅛㅜㅝㅞㅟㅠㅡㅢㅣ'.split('');
const JO=['','ㄱ','ㄲ','ㄳ','ㄴ','ㄵ','ㄶ','ㄷ','ㄹ','ㄺ','ㄻ','ㄼ','ㄽ','ㄾ','ㄿ','ㅀ','ㅁ','ㅂ','ㅄ','ㅅ','ㅆ','ㅇ','ㅈ','ㅊ','ㅋ','ㅌ','ㅍ','ㅎ'];
const SPLIT={ㄳ:'ㄱㅅ',ㄵ:'ㄴㅈ',ㄶ:'ㄴㅎ',ㄺ:'ㄹㄱ',ㄻ:'ㄹㅁ',ㄼ:'ㄹㅂ',ㄽ:'ㄹㅅ',ㄾ:'ㄹㅌ',ㄿ:'ㄹㅍ',ㅀ:'ㄹㅎ',ㅄ:'ㅂㅅ'};
const REDUCE={ㄱ:'ㄱ',ㄲ:'ㄱ',ㅋ:'ㄱ',ㄳ:'ㄱ',ㄺ:'ㄱ',ㄷ:'ㄷ',ㅅ:'ㄷ',ㅆ:'ㄷ',ㅈ:'ㄷ',ㅊ:'ㄷ',ㅌ:'ㄷ',ㅎ:'ㄷ',ㅂ:'ㅂ',ㅍ:'ㅂ',ㅄ:'ㅂ',ㄿ:'ㅂ',ㄴ:'ㄴ',ㄵ:'ㄴ',ㄶ:'ㄴ',ㄹ:'ㄹ',ㄼ:'ㄹ',ㄽ:'ㄹ',ㄾ:'ㄹ',ㅀ:'ㄹ',ㄻ:'ㅁ',ㅁ:'ㅁ',ㅇ:'ㅇ','':''};
const TENSE={ㄱ:'ㄲ',ㄷ:'ㄸ',ㅂ:'ㅃ',ㅅ:'ㅆ',ㅈ:'ㅉ'};
const ROM_C={ㄱ:'g',ㄲ:'kk',ㄴ:'n',ㄷ:'d',ㄸ:'tt',ㄹ:'r',ㅁ:'m',ㅂ:'b',ㅃ:'pp',ㅅ:'s',ㅆ:'ss',ㅇ:'',ㅈ:'j',ㅉ:'jj',ㅊ:'ch',ㅋ:'k',ㅌ:'t',ㅍ:'p',ㅎ:'h'};
const ROM_V={ㅏ:'a',ㅐ:'ae',ㅑ:'ya',ㅒ:'yae',ㅓ:'eo',ㅔ:'e',ㅕ:'yeo',ㅖ:'ye',ㅗ:'o',ㅘ:'wa',ㅙ:'wae',ㅚ:'oe',ㅛ:'yo',ㅜ:'u',ㅝ:'wo',ㅞ:'we',ㅟ:'wi',ㅠ:'yu',ㅡ:'eu',ㅢ:'ui',ㅣ:'i'};
const ROM_F={'':'',ㄱ:'k',ㄴ:'n',ㄷ:'t',ㄹ:'l',ㅁ:'m',ㅂ:'p',ㅇ:'ng'};
const RULES={
  link:['Linking','A final consonant moves onto the next vowel.'],
  nasal:['Nasalization','ㄱ ㄷ ㅂ turn into ㅇ ㄴ ㅁ before ㄴ or ㅁ.'],
  tense:['Tensing','A plain consonant hardens after a stopped final sound.'],
  asp:['Aspiration','ㅎ next to ㄱ ㄷ ㅂ ㅈ makes a breathy ㅋ ㅌ ㅍ ㅊ.'],
  lat:['ㄹ assimilation','ㄴ next to ㄹ becomes ㄹ.'],
  pal:['Palatalization','ㄷ ㅌ before 이 sound like ㅈ ㅊ.'],
  fin:['Final sound','A final consonant is cut short to one of seven sounds.'],
  hdrop:['Silent ㅎ','A final ㅎ disappears before a vowel.'],
  vow:['Vowel ㅢ','After a consonant, ㅢ is said as ㅣ.']
};
// Words the rules can't predict. [written word, syllable offset, spoken first consonant]
const EXCEPT=[['발병',1,'ㅃ']];
const TENSE_AFTER_L=/^[거것게걸수]/;

function hangul(ch){const n=ch.charCodeAt(0)-0xAC00;return n>=0&&n<11172}
function parts(ch){const n=ch.charCodeAt(0)-0xAC00;return{c:CH[Math.floor(n/588)],v:JU[Math.floor(n%588/28)],f:JO[n%28]}}
function build(p){return String.fromCharCode(0xAC00+(CH.indexOf(p.c)*21+JU.indexOf(p.v))*28+JO.indexOf(p.f))}

function analyze(text){
  const out=[...text].map(ch=>hangul(ch)?{o:ch,...parts(ch),tags:[]}:{o:ch,other:true,tags:[]});
  const tag=(s,t)=>{if(!s.tags.includes(t))s.tags.push(t)};
  for(let i=0;i<out.length;i++){
    const a=out[i];
    if(a.other)continue;
    if(a.c!=='ㅇ'&&a.v==='ㅢ'){a.v='ㅣ';tag(a,'vow')}
    if(!a.f)continue;
    let j=i+1,gap=false;
    while(out[j]&&out[j].o===' '){gap=true;j++}
    const b=out[j]&&!out[j].other?out[j]:null;
    const f0=a.f;
    const setF=(f,t)=>{a.f=f;if(t)tag(a,t)};
    if(!b){setF(REDUCE[f0],REDUCE[f0]!==f0?'fin':null);continue}

    // Final ㅎ family
    if(!gap&&(f0==='ㅎ'||f0==='ㄶ'||f0==='ㅀ')){
      const rest=f0==='ㅎ'?'':SPLIT[f0][0];
      if('ㄱㄷㅈ'.includes(b.c)){b.c={ㄱ:'ㅋ',ㄷ:'ㅌ',ㅈ:'ㅊ'}[b.c];setF(rest);tag(b,'asp');tag(a,'asp');continue}
      if(b.c==='ㅅ'){b.c='ㅆ';setF(rest);tag(b,'tense');continue}
      if(b.c==='ㅇ'){
        if(rest){b.c=rest;setF('');tag(b,'link');tag(a,'link')}else{setF('');tag(a,'hdrop')}
        continue
      }
      if(b.c==='ㄴ'){
        if(f0==='ㅎ')setF('ㄴ','nasal');
        else if(f0==='ㅀ'){setF('ㄹ');b.c='ㄹ';tag(b,'lat')}
        else setF('ㄴ');
        continue
      }
    }

    const r=(a.o==='밟')?'ㅂ':REDUCE[f0];

    // Stopped final + ㅎ
    if(!gap&&b.c==='ㅎ'&&'ㄱㄷㅂ'.includes(r)&&f0!=='ㅎ'){
      let keep='';
      if(SPLIT[f0]&&SPLIT[f0][0]==='ㄹ')keep='ㄹ';
      if(SPLIT[f0]&&SPLIT[f0][0]==='ㄴ')keep='ㄴ';
      b.c=r==='ㄱ'?'ㅋ':r==='ㅂ'?'ㅍ':(b.v==='ㅣ'||'ㅈㅊ'.includes(f0))?'ㅊ':'ㅌ';
      setF(keep);tag(b,'asp');tag(a,'asp');continue
    }

    // Next syllable starts with a vowel
    if(b.c==='ㅇ'){
      if(f0==='ㅇ')continue;
      if(gap){
        if(r){b.c=r;setF('');tag(b,'link');tag(a,'link')}
        continue
      }
      if(b.v==='ㅣ'&&(f0==='ㄷ'||f0==='ㅌ'||f0==='ㄾ')){
        b.c=f0==='ㄷ'?'ㅈ':'ㅊ';setF(f0==='ㄾ'?'ㄹ':'');tag(b,'pal');tag(a,'pal');continue
      }
      if(SPLIT[f0]){
        const [x,y]=SPLIT[f0];
        b.c=y==='ㅅ'?'ㅆ':y;setF(x);tag(b,'link');tag(a,'link');continue
      }
      b.c=f0;setF('');tag(b,'link');tag(a,'link');continue
    }

    // Next syllable starts with a consonant
    let f=r;
    if(f0==='ㄺ'&&b.c==='ㄱ'&&!gap)f='ㄹ';
    if('ㄱㄷㅂ'.includes(r)){
      if(b.c==='ㄴ'||b.c==='ㅁ'){f={ㄱ:'ㅇ',ㄷ:'ㄴ',ㅂ:'ㅁ'}[r];tag(a,'nasal')}
      else if(b.c==='ㄹ'&&!gap){f={ㄱ:'ㅇ',ㄷ:'ㄴ',ㅂ:'ㅁ'}[r];b.c='ㄴ';tag(a,'nasal');tag(b,'nasal')}
      else if(!gap&&TENSE[b.c]){b.c=TENSE[b.c];tag(b,'tense')}
    }else if(!gap&&(r==='ㅁ'||r==='ㅇ')&&b.c==='ㄹ'){b.c='ㄴ';tag(b,'nasal')}
    else if(!gap&&r==='ㄴ'&&b.c==='ㄹ'){f='ㄹ';tag(a,'lat')}
    else if(!gap&&r==='ㄹ'&&b.c==='ㄴ'){b.c='ㄹ';tag(b,'lat')}
    if(!gap&&(f0==='ㄵ'||f0==='ㄻ'||f0==='ㄼ'||f0==='ㄾ')&&TENSE[b.c]){b.c=TENSE[b.c];tag(b,'tense')}
    if(gap&&r==='ㄹ'&&f0==='ㄹ'&&TENSE[b.c]){
      const word=text.slice(j).split(' ')[0];
      if(TENSE_AFTER_L.test(word)){b.c=TENSE[b.c];tag(b,'tense')}
    }
    if(f!==f0&&!a.tags.length)tag(a,'fin');
    a.f=f;
  }
  for(const [w,off,c] of EXCEPT){
    let at=text.indexOf(w);
    while(at>=0){const s=out[at+off];if(s&&!s.other){s.c=c;tag(s,'tense')}at=text.indexOf(w,at+1)}
  }
  return out.map(s=>{
    if(s.other)return{o:s.o,s:s.o,tags:[],changed:false};
    const sp=build(s);
    return{o:s.o,s:sp,c:s.c,v:s.v,f:s.f,tags:s.tags,changed:sp!==s.o};
  });
}
function spoken(text){return analyze(text).map(x=>x.s).join('')}
function roman(text){
  const a=analyze(text);let r='';
  a.forEach((s,i)=>{
    if(s.c===undefined){r+=s.o;return}
    const prev=a[i-1];
    r+=(s.c==='ㄹ'&&prev&&prev.f==='ㄹ')?'l':ROM_C[s.c];
    r+=ROM_V[s.v]+ROM_F[s.f];
  });
  return r;
}

// Songs. Glosses follow the spaces in each line: [dictionary form, meaning].

const clientId=()=>CLIENT_ID||prefs.clientId;
function signIn(prompt){
  return new Promise((res,rej)=>{
    if(!window.google||!google.accounts){rej({message:'Google sign-in has not loaded. Check your connection and try again.'});return}
    const c=google.accounts.oauth2.initTokenClient({client_id:clientId(),scope:SCOPES,
      callback:r=>{if(r.error){rej({message:r.error_description||r.error});return}
        auth={token:r.access_token,exp:Date.now()+(r.expires_in-60)*1000};prefs.connected=true;saveLocal();res(auth.token)},
      error_callback:e=>rej({message:e.type==='popup_closed'?'Sign-in was closed before it finished.':'Sign-in could not open. Allow pop-ups for this page.'})});
    c.requestAccessToken({prompt});
  });
}
async function token(){return auth&&auth.exp>Date.now()?auth.token:signIn('')}
const live=()=>!!(auth&&auth.exp>Date.now());
async function gfetch(url,opts={}){
  const t=await token();
  const r=await fetch(url,{...opts,headers:{...(opts.headers||{}),Authorization:'Bearer '+t}});
  if(r.status===401){auth=null}
  if(!r.ok){
    let reason='',msg='';
    try{const j=await r.json();reason=j.error.errors?.[0]?.reason||'';msg=j.error.message||''}catch(e){}
    if(reason==='quotaExceeded')throw{message:'Today\'s YouTube search allowance is used up. It resets tomorrow. Pasting a link still works.'};
    throw{message:msg||('Google returned an error ('+r.status+').')};
  }
  return r;
}

const DRIVE='https://www.googleapis.com/drive/v3/files';
async function pull(){
  syncState='syncing';syncNote();
  const list=await (await gfetch(DRIVE+"?spaces=appDataFolder&fields=files(id)&q="+encodeURIComponent("name='ttara.json'"))).json();
  if(list.files&&list.files[0]){
    driveId=list.files[0].id;
    const o=await (await gfetch(DRIVE+'/'+driveId+'?alt=media')).json();
    mergeCloud(o);
  }
  await push();
}
function mergeCloud(o){
  const gone=[...new Set([...(P.deleted||[]),...((o.P&&o.P.deleted)||[])])];
  const next={...(o.custom||{})};
  Object.values(custom).forEach(s=>{if(!next[s.id]||(s.updated||0)>(next[s.id].updated||0))next[s.id]=s});
  gone.forEach(id=>delete next[id]);
  custom=next;
  if(o.P&&(o.P.updated||0)>(P.updated||0))P={...P,...o.P};
  P.deleted=gone;
  saveLocal();
  if(view.v==='home'||view.v==='review')render();else chrome();
}
function queuePush(){clearTimeout(pushT);if(!prefs.connected)return;syncState=live()?'syncing':'waiting';syncNote();if(live())pushT=setTimeout(()=>push().catch(pushFail),2000)}
function pushFail(){syncState='waiting';syncNote()}
async function push(){
  const body=JSON.stringify({P,custom});
  if(driveId){
    await gfetch('https://www.googleapis.com/upload/drive/v3/files/'+driveId+'?uploadType=media',{method:'PATCH',headers:{'Content-Type':'application/json'},body});
  }else{
    const b='ttara'+Date.now();
    const meta=JSON.stringify({name:'ttara.json',parents:['appDataFolder']});
    const r=await gfetch('https://www.googleapis.com/upload/drive/v3/files?uploadType=multipart&fields=id',{method:'POST',headers:{'Content-Type':'multipart/related; boundary='+b},
      body:`--${b}\r\nContent-Type: application/json\r\n\r\n${meta}\r\n--${b}\r\nContent-Type: application/json\r\n\r\n${body}\r\n--${b}--`});
    driveId=(await r.json()).id;
  }
  syncState='synced';syncNote();
}
async function connect(){
  if(!clientId()){view.v='settings';render();toast('Add your Google client ID first.');return}

/* Parsing */
function videoId(s){
  s=s.trim();
  if(/^[\w-]{11}$/.test(s))return s;
  const m=s.match(/(?:youtu\.be\/|[?&]v=|\/shorts\/|\/embed\/|\/live\/)([\w-]{11})/);
  return m?m[1]:null;
}
function parseLyrics(text){
  const out=[];let timed=false;
  text.split(/\r?\n/).forEach(raw=>{
    const m=raw.match(/^\s*\[(\d+):(\d+(?:[.:]\d+)?)\]\s*(.*)$/);
    if(m){
      timed=true;
      const t=+m[1]*60+parseFloat(m[2].replace(':','.'));
      if(out.length&&out[out.length-1].end==null)out[out.length-1].end=t;
      if(m[3].trim())out.push({ko:m[3].trim(),t});
    }else if(/^\s*\[[a-z]+:.*\]\s*$/i.test(raw)){/* LRC metadata */}
    else if(raw.trim())out.push({ko:raw.trim()});
  });
  return{lines:out,timed};
}
function cleanTitle(t){
  return t.replace(/\[[^\]]*\]|\([^)]*\)|【[^】]*】/g,' ')
    .replace(/\b(official|music video|m\/?v|lyrics?|lyric video|audio|teaser|hd|4k)\b/gi,' ')
    .replace(/가사|뮤직비디오/g,' ').replace(/[|｜]/g,' ').replace(/['"‘’“”]/g,' ').replace(/\s+/g,' ').trim();
}

/* YouTube player */
let yt=null,ytReady=false,ytLoading=false,ytFor=null;
window.onYouTubeIframeAPIReady=()=>{ytReady=true;mountPlayer()};
function loadYT(){if(ytLoading)return;ytLoading=true;const s=document.createElement('script');s.src='https://www.youtube.com/iframe_api';document.head.append(s)}
function mountPlayer(){
  const a=att(view.song),host=$('#ythost');
  if(!a||!a.yt||!host)return;
  if(!ytReady){loadYT();return}
  killPlayer();
  ytFor=view.song;
  yt=new YT.Player('ythost',{videoId:a.yt,playerVars:{playsinline:1,rel:0,origin:location.origin},
    events:{onError:e=>{
      const blocked=e.data===101||e.data===150;
      toast(blocked?'This video\'s owner blocks playback in other apps. Try a lyric video or another upload.':'YouTube could not play this video.');stopAll()}}});
}
function killPlayer(){if(yt){try{yt.destroy()}catch(e){}yt=null;ytFor=null}}
const ytOK=()=>yt&&typeof yt.seekTo==='function'&&ytFor===view.song;
function segment(id,i,song){
  const a=att(id);
  if(!a||!a.times||a.times[i]==null)return null;
  const off=a.offset||0,start=a.times[i]+off;
  let end=a.ends&&a.ends[i]!=null?a.ends[i]+off:null;
  if(end==null&&a.times[i+1]!=null)end=a.times[i+1]+off;
  if(end==null&&ytOK()){const d=yt.getDuration&&yt.getDuration();if(d)end=d}
  if(end==null)end=start+8;
  return end>start?[Math.max(0,start),end]:null;
}
const useVideo=(song,i)=>prefs.voice==='video'&&ytOK()&&segment(song.id,i);

/* Speech and playback */
let run=0,raf=0;
function koVoice(){
  if(!window.speechSynthesis)return null;
  const vs=speechSynthesis.getVoices();
  if(!vs.length)return undefined;
  return vs.find(v=>/^ko/i.test(v.lang))||null;
}
function tts(text,rate,onstart){
  return new Promise(res=>{
    if(!window.speechSynthesis){onstart&&onstart();res(false);return}
    speechSynthesis.cancel();
    const u=new SpeechSynthesisUtterance(text);
    u.lang='ko-KR';u.rate=rate;
    const v=koVoice();if(v)u.voice=v;
    let done=false;
    const fin=ok=>{if(done)return;done=true;clearTimeout(w);res(ok)};
    const w=setTimeout(()=>fin(true),[...text].length*400/rate+4000);
    u.onstart=()=>onstart&&onstart();
    u.onend=()=>fin(true);u.onerror=()=>fin(false);
    speechSynthesis.speak(u);
  });
}
function speakOnce(text,rate=.8){
  if(koVoice()===null)toast('This device has no Korean voice. Add one in your system language settings.');
  stopAll();tts(text,rate);
}
function stopAll(){
  run++;cancelAnimationFrame(raf);
  if(window.speechSynthesis)speechSynthesis.cancel();
  if(ytOK()&&yt.pauseVideo)try{yt.pauseVideo()}catch(e){}
  releaseWake();setPlayBtn(false);
  const t=$('#turnlabel');if(t)t.textContent='';
  const b=$('#turnbar');if(b)b.style.width='0';
}
function setPlayBtn(on){const b=$('#play');if(b){b.textContent=on?'Stop':'Play';b.dataset.on=on?'1':''}}
function fill(k){
  const sy=[...document.querySelectorAll('#now .sy')],n=Math.ceil(Math.max(0,Math.min(1,k))*sy.length);
  sy.forEach((s,i)=>s.classList.toggle('on',i<n));
}
function wipeOver(dur,id){
  const start=performance.now();
  const step=t=>{if(id!==run)return;const k=(t-start)/(dur*1000);fill(k);if(k<1)raf=requestAnimationFrame(step)};
  raf=requestAnimationFrame(step);
}
function videoLine(song,i,id){
  const seg=segment(song.id,i);
  return new Promise(res=>{
    yt.setPlaybackRate(prefs.speed);yt.seekTo(seg[0],true);yt.playVideo();fill(0);
    const step=()=>{
      if(id!==run){res(0);return}
      const t=yt.getCurrentTime()||0;
      fill((t-seg[0])/(seg[1]-seg[0]));
      if(t>=seg[1]-.05||yt.getPlayerState()===0){yt.pauseVideo();res((seg[1]-seg[0])/prefs.speed);return}
      raf=requestAnimationFrame(step);
    };
    raf=requestAnimationFrame(step);
  });
}
function followSong(song,id){
  // Whole song on the video: keep playing and let the lyrics follow the clock.
  const a=att(song.id),off=a.offset||0;
  return new Promise(res=>{
    const seg=segment(song.id,view.line);
    yt.setPlaybackRate(prefs.speed);yt.seekTo(seg[0],true);yt.playVideo();
    const step=()=>{
      if(id!==run){res();return}
      const t=yt.getCurrentTime()||0;
      let i=view.line;
      while(a.times[i+1]!=null&&t>=a.times[i+1]+off)i++;
      if(i!==view.line){view.line=i;stage()}
      const s=segment(song.id,i);
      if(s)fill((t-s[0])/(s[1]-s[0]));
      if(yt.getPlayerState()===0||(i===song.lines.length-1&&s&&t>=s[1])){res();return}
      raf=requestAnimationFrame(step);
    };
    raf=requestAnimationFrame(step);
  });
}
function sayLine(song,i,id){
  if(useVideo(song,i))return videoLine(song,i,id);
  const ko=song.lines[i].ko,rate=prefs.speed;
  const est=[...ko.replace(/\s/g,'')].length*.2/rate+.3;
  const t0=performance.now();
  return tts(ko,rate,()=>wipeOver(est,id)).then(()=>{
    if(id===run)fill(1);
    return Math.max(1,(performance.now()-t0)/1000);
  });
}
function yourTurn(dur,id){
  return new Promise(res=>{
    const bar=$('#turnbar'),lab=$('#turnlabel');
    if(lab)lab.textContent='Your turn';
    const start=performance.now(),len=dur*1200;
    const step=t=>{
      if(id!==run){res();return}
      const k=Math.min(1,(t-start)/len);
      if(bar)bar.style.width=(k*100)+'%';
      if(k<1)raf=requestAnimationFrame(step);
      else{if(bar)bar.style.width='0';if(lab)lab.textContent='';res()}
    };
    raf=requestAnimationFrame(step);
  });
}
let wake=null;
function holdWake(){try{navigator.wakeLock&&navigator.wakeLock.request('screen').then(w=>wake=w).catch(()=>{})}catch(e){}}
function releaseWake(){try{wake&&wake.release()}catch(e){}wake=null}
async function playSeq(){
  const song=getSong(view.song),a=att(song.id);
  if(prefs.voice==='video'&&a&&a.yt&&!useVideo(song,view.line)){
    toast(ytOK()?'Mark the lines first so the video can follow them. Using the computer voice for now.':'The video is still loading. Using the computer voice for now.');
  }else if(!useVideo(song,view.line)&&koVoice()===null)toast('This device has no Korean voice. Add one in your system language settings, or attach a video.');
  const id=++run;setPlayBtn(true);
  if(prefs.mode!=='one')holdWake();
  if(prefs.mode==='song'&&!prefs.shadow&&useVideo(song,view.line)){await followSong(song,id);if(id===run){setPlayBtn(false);releaseWake()}return}
  for(;;){
    const dur=await sayLine(song,view.line,id);
    if(id!==run)return;
    if(prefs.shadow){await yourTurn(dur,id);if(id!==run)return}
    if(prefs.mode==='loop')continue;
    if(prefs.mode==='song'&&view.line<song.lines.length-1){view.line++;stage();continue}
    break;
  }
  setPlayBtn(false);releaseWake();
}

/* Toast and sheet */
let toastT;
function toast(m){const t=$('#toast');t.textContent=m;t.hidden=false;clearTimeout(toastT);toastT=setTimeout(()=>t.hidden=true,4500)}
function openSheet(html){$('#sheet').innerHTML='<div class="in">'+html+'</div>';$('#sheet').hidden=false;$('#veil').hidden=false}
function closeSheet(){$('#sheet').hidden=true;$('#veil').hidden=true}

/* Deck */
const cardKey=(song,base)=>song+'|'+base;
function addCard(song,li,wi){
  const l=song.lines[li],w=words(l)[wi],g=(l.g&&l.g[wi])||[w,''];
  const key=cardKey(song.id,g[0]);
  if(P.deck[key])return false;
  P.deck[key]={key,ko:g[0],form:w,en:g[1]||'',song:song.id,title:song.title,line:l.ko,ef:2.5,int:0,rep:0,due:Date.now()};
  return true;
}
function has(song,li,wi){const l=song.lines[li],w=words(l)[wi],g=(l.g&&l.g[wi])||[w];return !!P.deck[cardKey(song.id,g[0])]}
function schedule(c,q){
  const n={...c};
  if(q===0){n.rep=0;n.int=0;n.ef=Math.max(1.3,c.ef-.2);n.due=Date.now()+10*60*1000;return n}
  n.ef=Math.max(1.3,c.ef+[0,-.15,0,.15][q]);
  let d;
  if(c.rep===0)d=q===3?4:1;
  else if(c.rep===1)d=q===1?3:q===3?8:6;
  else d=Math.round(c.int*(q===1?1.2:q===3?c.ef*1.3:c.ef));
  n.rep=c.rep+1;n.int=d;n.due=Date.now()+d*DAY;return n;
}
const ivl=(c,q)=>{const n=schedule(c,q);return q===0?'10m':n.int+'d'};
function tick(){
  const today=dayKey();
  if(P.lastDay===today){P.done++;return}
  P.streak=P.lastDay===dayKey(Date.now()-DAY)?P.streak+1:1;
  P.lastDay=today;P.done=1;
}

function glossPrompt(lines){
  return `I'm a beginner learning Korean and studying this song, which I pasted myself. For each numbered line, give a short plain English meaning of the line, and for each space-separated word in order, give its dictionary form and a short English gloss (add particles or endings briefly, as in "wind; 이 marks the subject").

${lines.map((l,i)=>(i+1)+'. '+l).join('\n')}`;

  const uniq=[...new Set(s.lines.map(l=>l.ko))];

function applyGloss(s,text){
  const a=text.indexOf('['),b=text.lastIndexOf(']');
  if(a<0||b<a)throw 0;
  const res=JSON.parse(text.slice(a,b+1));
  if(!Array.isArray(res))throw 0;
  const uniq=[...new Set(s.lines.map(l=>l.ko))],map={};
  uniq.forEach((ko,i)=>{
    const r=res[i]||{},n=ko.split(/\s+/).filter(Boolean).length;
    map[ko]={en:typeof r.en==='string'?r.en:'',g:Array.isArray(r.g)&&r.g.length===n?r.g.map(x=>[String(x[0]||''),String(x[1]||'')]):null};
  });
  s.lines=s.lines.map(l=>({...l,en:map[l.ko].en,...(map[l.ko].g?{g:map[l.ko].g}:{})}));
}

/* Gap fill */
let gap=null;
function newGap(s){
  const pool=[...new Set(s.lines.flatMap(words))].filter(w=>hasKo(w)&&[...w].length>=2);
  const lines=[...new Map(s.lines.filter(l=>hasKo(l.ko)).map(l=>[l.ko,l])).values()].sort(()=>Math.random()-.5).slice(0,8);
  const qs=lines.map(l=>{
    const ws=words(l),cand=ws.filter(w=>hasKo(w)&&[...w].length>=2);
    const pick=cand[Math.floor(Math.random()*cand.length)]||ws[0];
    const others=pool.filter(w=>w!==pick).sort(()=>Math.random()-.5).slice(0,3);
    return{l,pick,opts:[pick,...others].sort(()=>Math.random()-.5)};
  }).filter(q=>q.opts.length>=2);
  gap={song:s.id,qs,i:0,right:0,picked:null};
}
function gapTab(s){
  if(!gap||gap.song!==s.id)newGap(s);
  const b=$('#body');
  if(!gap.qs.length){b.innerHTML='<p class="muted">This song needs more words for a gap fill.</p>';return}
  if(gap.i>=gap.qs.length){
    const pct=Math.round(gap.right/gap.qs.length*100);
    b.innerHTML=`<div class="card"><p class="muted">점수</p><div class="score">${pct}<small>점</small></div><p>${gap.right} of ${gap.qs.length} gaps correct</p><div class="row" style="justify-content:center"><button class="btn primary" data-gapagain="1">Sing it again</button></div></div>`;
    return;
  }
  const q=gap.qs[gap.i],at=q.l.ko.indexOf(q.pick);
  const x=q.l.ko.slice(0,at),y=q.l.ko.slice(at+q.pick.length);
  const fillIn=gap.picked!=null?`<span style="color:var(--wipe)">${esc(q.pick)}</span>`:'<span class="blank">　　</span>';
  b.innerHTML=`<div class="card"><div class="muted">Gap ${gap.i+1} of ${gap.qs.length}</div>
   <div class="kara" style="font-size:clamp(22px,6vw,32px)" lang="ko">${esc(x)}${fillIn}${esc(y)}</div>
   ${q.l.en?`<p class="muted">${esc(q.l.en)}</p>`:''}
   <div class="row" style="justify-content:center"><button class="btn" data-speak="${esc(q.l.ko)}">Listen to the line</button></div>
   <div class="opts">${q.opts.map(o=>{
     let c='';if(gap.picked!=null){if(o===q.pick)c='ok';else if(o===gap.picked)c='no'}
     return `<button lang="ko" class="${c}" data-opt="${esc(o)}"${gap.picked!=null?' disabled':''}>${esc(o)}</button>`}).join('')}</div>
   ${gap.picked!=null?`<div class="row" style="justify-content:center"><button class="btn primary" data-gapnext="1">Next</button></div>`:''}</div>`;
}

async function lookup(){
  const title=$('#ftitle').value.trim(),artist=$('#fartist').value.trim(),st=$('#lookstate'),hits=$('#hits');
  if(!title){st.textContent='Add a song title first.';return}
  st.textContent='Looking…';hits.innerHTML='';
  try{
    const r=await fetch('https://lrclib.net/api/search?q='+encodeURIComponent((artist+' '+title).trim()));
    if(!r.ok)throw 0;
    const rows=(await r.json()).filter(x=>x.syncedLyrics||x.plainLyrics);
    rows.sort((a,b)=>(hasKo(b.syncedLyrics||b.plainLyrics)-hasKo(a.syncedLyrics||a.plainLyrics))||(!!b.syncedLyrics-!!a.syncedLyrics));
    draft.hits=rows.slice(0,6);
    st.textContent=rows.length?'Pick the match. Check that it fits your video.':'No lyrics found. Paste them below.';
    hits.innerHTML=draft.hits.length?`<div class="sheetlist">${draft.hits.map((h,i)=>`<button data-hit="${i}">${esc(h.trackName)} · ${esc(h.artistName)} · ${Math.floor((h.duration||0)/60)}:${String(Math.round((h.duration||0)%60)).padStart(2,'0')} · ${h.syncedLyrics?'timed':'not timed'}${hasKo(h.syncedLyrics||h.plainLyrics)?'':' · not Korean'}</button>`).join('')}</div>`:'';
  }catch(e){st.textContent='The lyrics lookup did not respond. Paste the lyrics below.'}
}
function buildSong(){
  const title=$('#ftitle').value.trim(),artist=$('#fartist').value.trim(),st=$('#buildstate');
  const {lines,timed}=parseLyrics($('#flyrics').value);
  if(!title){st.textContent='Add a song title first.';return}
  if(lines.filter(l=>hasKo(l.ko)).length<2){st.textContent='Paste at least two lines of Korean lyrics.';return}
  if(lines.length>200){st.textContent='Keep it under 200 lines.';return}
  const id='s'+Date.now().toString(36);
  const song={id,title,by:artist,added:Date.now(),lines:lines.map(l=>({ko:l.ko}))};
  if(draft.yt){
    P.att[id]={yt:draft.yt,offset:0};
    if(timed&&lines.every(l=>l.t!=null)){P.att[id].times=lines.map(l=>l.t);P.att[id].ends=lines.map(l=>l.end??null)}
  }
  saveSong(song);
  view={v:'song',song:id,tab:'sing',line:0};render();window.scrollTo(0,0);
}
async function pick(id,raw,channel,thumb){
  const c=cleanTitle(raw);let title=c,artist=channel.replace(/ - Topic$/,'').replace(/VEVO$/,'').trim();
  const m=c.match(/^(.+?)\s+[-–—]\s+(.+)$/);
  if(m){artist=m[1].trim();title=m[2].trim()}
  draft={yt:id,rawTitle:raw,channel,thumb,title,artist,lyrics:'',hits:[]};
  view.v='setup';render();window.scrollTo(0,0);
  if(title)lookup();
}
async function useLink(text){
  const id=videoId(text);
  if(!id){toast('That doesn\'t look like a YouTube link.');return}
  let t='',c='';
  try{const r=await fetch('https://www.youtube.com/oembed?format=json&url='+encodeURIComponent('https://www.youtube.com/watch?v='+id));if(r.ok){const j=await r.json();t=j.title||'';c=j.author_name||''}}catch(e){}
  pick(id,t,c,`https://i.ytimg.com/vi/${id}/mqdefault.jpg`);
}

/* Settings */
function settings(){
  $('#app').innerHTML=`<header class="top"><div><button class="link" data-nav="home">← Songs</button><h1>Settings</h1></div></header>
  ${CLIENT_ID?'':`<label class="field">Google client ID<input id="cid" type="text" value="${esc(prefs.clientId)}" autocomplete="off"></label>
  <p class="muted">Page address for Google setup: ${esc(location.origin)}</p>`}
  <div class="row"><button class="btn primary" id="connect">${live()?'Connected':'Connect YouTube'}</button>${prefs.connected?'<button class="btn" id="signout">Disconnect</button>':''}</div>
  <p class="muted" id="syncnote">${syncText()}</p>
  <label class="field">Daily goal<input id="goal" type="text" inputmode="numeric" value="${P.goal}"></label>`;
}

/* Marking lines against the video */
let marking=null;
function startMark(){
  if(!ytOK()){toast('The video is still loading. Try again in a moment.');return}
  const s=getSong(view.song);
  stopAll();marking={i:0,times:[]};
  yt.setPlaybackRate(1);yt.seekTo(0,true);yt.playVideo();
  markBar(s);
}
function markBar(s){
  const i=marking.i,el=$('#markbar');
  el.hidden=false;
  el.innerHTML=`<div class="in"><p class="muted">Tap when this line starts · ${i+1} of ${s.lines.length}</p><p class="markline" lang="ko">${esc(s.lines[i].ko)}</p>
  <div class="row"><button class="btn primary" data-markhit="1" style="flex:1">Now</button><button class="btn" data-markstop="1">Cancel</button></div></div>`;
}

/* Events */
document.addEventListener('submit',e=>{
  e.preventDefault();
  if(e.target.id==='linkform')useLink($('#link').value);
  if(e.target.id==='searchform'){const q=$('#q').value.trim();if(q)load('Results for '+q,async()=>({items:await ytSearch(q)}))}
});
document.addEventListener('click',async e=>{
  if(e.target.id==='veil'){closeSheet();return}
  const t=e.target.closest('button');
  if(!t)return;
  const d=t.dataset;
  if(d.nav){stopAll();view={...view,v:d.nav};render();window.scrollTo(0,0);return}
  if(d.open){view={v:'song',song:d.open,tab:'sing',line:0};render();window.scrollTo(0,0);return}
  if(d.tab){stopAll();view.tab=d.tab;songView();return}
  if(t.id==='play'){if(d.on==='1')stopAll();else playSeq();return}
  if(d.step){stopAll();const s=getSong(view.song);view.line=Math.min(s.lines.length-1,Math.max(0,view.line+ +d.step));stage();return}
  if(d.line){stopAll();view.line=+d.line;stage();return}
  if(d.pref){prefs[d.pref]=!prefs[d.pref];t.setAttribute('aria-pressed',prefs[d.pref]);saveLocal();stage();return}
  if(d.w){wordSheet(view.line,+d.w);return}
  if(d.sheet){const [a,b]=d.sheet.split(':').map(Number);wordSheet(a,b);return}
  if(d.speak){speakOnce(d.speak);return}
  if(d.close){closeSheet();return}
  if(d.addw){
    const [a,b]=d.addw.split(':').map(Number),s=getSong(view.song),inp=$('#glossin');
    if(inp&&inp.value.trim()){const l=s.lines[a];l.g=l.g||words(l).map(w=>[w,'']);l.g[b]=[words(l)[b],inp.value.trim()]}
    addCard(s,a,b);if(custom[s.id])saveSong(s);else save();chrome();closeSheet();if(view.tab==='words')wordsTab(s);toast('Added to Review.');return
  }
  if(d.addall){
    const s=getSong(view.song);let n=0;
    s.lines.forEach((l,li)=>words(l).forEach((w,wi)=>{if(hasKo(w)&&addCard(s,li,wi))n++}));
    save();chrome();wordsTab(s);toast(n+' words added to Review.');return
  }
  if(d.gloss){glossSheet(getSong(view.song));return}
  if(d.copyprompt){
    const a=$('#glossprompt');
    try{await navigator.clipboard.writeText(a.value);toast('Copied.')}catch(err){a.select();toast('Select all and copy the request.')}
    return
  }
  if(d.glossapply){
    const s=getSong(view.song);
    try{applyGloss(s,$('#glossreply').value);if(custom[s.id])saveSong(s);closeSheet();wordsTab(s);toast('Meanings added.')}
    catch(err){toast('That reply isn\'t in the expected format. Copy Claude\'s whole reply.')}
    return
  }
  if(d.opt){const q=gap.qs[gap.i];gap.picked=d.opt;if(d.opt===q.pick)gap.right++;gapTab(getSong(view.song));return}
  if(d.gapnext){gap.i++;gap.picked=null;gapTab(getSong(view.song));return}
  if(d.gapagain){gap=null;gapTab(getSong(view.song));return}
  if(d.reveal){rv.show=true;review();return}
  if(d.rvsound){rv.sounds=!rv.sounds;review();return}
  if(d.rate){const c=rv.card;P.deck[c.key]=schedule(c,+d.rate);tick();rv={card:null,show:false,sounds:false};save();chrome();review();return}
  if(t.id==='connect'||t.id==='reconnect'){const c=$('#cid');if(c){prefs.clientId=c.value.trim();saveLocal()}await connect();return}
  if(t.id==='signout'){auth=null;prefs.connected=false;saveLocal();render();return}
  if(t.id==='liked'){load('Liked videos',async()=>({items:await ytLiked()}));return}
  if(t.id==='lists'){load('My playlists',async()=>({lists:await ytPlaylists()}));return}
  if(d.plist){load(d.title,async()=>({items:await ytPlaylist(d.plist)}));return}
  if(d.pick!==undefined){const img=t.querySelector('img');pick(d.pick,d.title,d.channel,img?img.src:'');return}
  if(t.id==='lookup'){lookup();return}
  if(d.hit){const h=draft.hits[+d.hit];$('#flyrics').value=h.syncedLyrics||h.plainLyrics;draft.lyrics=$('#flyrics').value;return}
  if(t.id==='build'){buildSong();return}
  if(d.att==='add'){
    const id=videoId($('#attlink').value);
    if(!id){toast('That doesn\'t look like a YouTube link.');return}
    P.att[view.song]={yt:id,offset:0};save();singTab(getSong(view.song));return
  }
  if(d.att==='remove'){stopAll();delete P.att[view.song];save();singTab(getSong(view.song));return}
  if(d.nudge){const a=att(view.song);a.offset=(a.offset||0)+ +d.nudge;save();$('#offset').textContent=a.offset.toFixed(2)+'s';return}
  if(t.id==='mark'){startMark();return}
  if(d.markhit){
    const s=getSong(view.song);marking.times[marking.i]=yt.getCurrentTime();view.line=marking.i;stage();marking.i++;
    if(marking.i>=s.lines.length){
      const a=att(s.id);a.times=marking.times;a.ends=null;a.offset=0;marking=null;$('#markbar').hidden=true;stopAll();save();singTab(s);toast('All lines marked.');
    }else markBar(s);
    return
  }
  if(d.markstop){marking=null;$('#markbar').hidden=true;stopAll();return}
  if(d.del==='ask'){$('#delrow').innerHTML='<span class="muted">Delete this song? Words in Review stay.</span><button class="btn" data-del="yes">Delete</button><button class="btn" data-del="no">Keep</button>';return}
  if(d.del==='no'){songView();return}
  if(d.del==='yes'){stopAll();dropSong(view.song);view={v:'home',song:null,tab:'sing',line:0};render();return}
});
document.addEventListener('change',e=>{
  const id=e.target.id;
  if(id==='speed'){prefs.speed=+e.target.value;saveLocal()}
  if(id==='mode'){prefs.mode=e.target.value;saveLocal()}
  if(id==='voice'){prefs.voice=e.target.value;saveLocal()}
  if(id==='cid'){prefs.clientId=e.target.value.trim();saveLocal()}
  if(id==='goal'){const n=parseInt(e.target.value,10);if(n>0){P.goal=n;save()}}
});
document.addEventListener('keydown',e=>{if(e.key==='Escape'&&!$('#sheet').hidden)closeSheet()});
document.addEventListener('visibilitychange',()=>{if(document.hidden&&live()&&syncState==='syncing')push().catch(pushFail)});
if(window.speechSynthesis)speechSynthesis.onvoiceschanged=()=>koVoice();

loadLocal();render();

</script>
</body>
