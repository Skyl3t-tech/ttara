<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#1e1214">
<meta name="referrer" content="strict-origin-when-cross-origin">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="따라 불러">
<title>따라 불러</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icon-192.png">
<link rel="icon" href="icon-192.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Do+Hyeon&family=Gowun+Batang:wght@400;700&family=IBM+Plex+Sans+KR:wght@400;600&family=Jua&family=Nanum+Pen+Script&family=Noto+Serif+KR:wght@500;700&display=swap">
<script src="https://accounts.google.com/gsi/client" async defer></script>
<style>
/* Layout: a warm listening room. Video and controls stay put; lyrics scroll past a centered current line. */
:root{
  color-scheme:dark;
  --screen:#1e1214; --panel:#2b1a1c; --raised:#3a2425; --edge:#4e3331; --ink:#fbf1e4; --dim:#cdb6a6;
  --wipe:#ffb74d; --hot:#ff8a65; --good:#a8d8a0; --bad:#ffa494; --on-accent:#2a1508;
  --ui:"IBM Plex Sans KR","Apple SD Gothic Neo","Malgun Gothic",system-ui,sans-serif;
  --display:"Gowun Batang","Noto Serif KR","Apple SD Gothic Neo",serif;
  --lyric:"Noto Serif KR","Apple SD Gothic Neo","Malgun Gothic",serif;
  --r:14px;
}
*{box-sizing:border-box}
html,body{margin:0;background:var(--screen);color:var(--ink)}
body{font:16px/1.55 var(--ui);-webkit-text-size-adjust:100%}
img{max-width:100%}
[hidden]{display:none!important}
button,select,input,textarea{font:inherit;color:inherit}
button{cursor:pointer;background:none;border:0;padding:0}
a{color:var(--wipe)}
:focus-visible{outline:2px solid var(--wipe);outline-offset:2px}
.app{max-width:720px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:16px 96px;display:flex;flex-direction:column;gap:20px}
h1,h2,h3{font-family:var(--display);font-weight:700;margin:0;text-wrap:balance;line-height:1.25}
h1{font-size:28px}h2{font-size:21px}h3{font-size:18px}
p{margin:0}
.muted{color:var(--dim);font-size:14px}
.top{display:flex;align-items:baseline;justify-content:space-between;gap:12px;flex-wrap:wrap}
.btn{padding:9px 16px;border-radius:999px;background:var(--raised);min-height:42px;transition:background .15s,color .15s}
.btn:hover{background:var(--edge)}
.btn.primary{background:var(--wipe);color:var(--on-accent);font-weight:600}
.btn.primary:hover{background:#ffc66e}
.btn[aria-pressed="true"]{background:var(--ink);color:var(--on-accent)}
.btn:disabled{opacity:.5;cursor:default}
.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.link{color:var(--wipe);font-size:14px}
label.field{display:flex;flex-direction:column;gap:4px;font-size:14px;color:var(--dim)}
input[type=text],textarea,select{background:var(--raised);border:0;border-radius:10px;padding:10px 12px;color:var(--ink);width:100%;min-height:42px}
textarea{min-height:200px;font-size:16px;line-height:1.6}
select{width:auto;border-radius:999px;padding:6px 10px;min-height:36px}
.block{display:flex;flex-direction:column;gap:10px;padding-top:16px}

/* Lyric type */
.kara{font-family:var(--lyric);font-weight:var(--lyric-w,700);color:var(--ink)}
.sy{transition:color .1s linear}
.sy.on{color:var(--wipe)}
.hero{padding:26px 16px;border-radius:var(--r);background:linear-gradient(135deg,var(--panel),var(--raised));text-align:center;display:flex;flex-direction:column;gap:6px}
.hero .kara{font-size:clamp(25px,7vw,38px)}
@media (prefers-reduced-motion:no-preference){.hero .sy{animation:fill 7s linear infinite;animation-delay:calc(var(--n)*.3s)}}
@keyframes fill{0%{color:var(--ink)}3%,72%{color:var(--wipe)}80%,100%{color:var(--ink)}}

/* Song list */
.songs{display:flex;flex-direction:column;gap:8px}
.song{display:grid;grid-template-columns:1fr auto;gap:2px 12px;padding:14px 16px;background:var(--panel);border-radius:var(--r);text-align:left;width:100%;transition:background .15s}
.song:hover{background:var(--raised)}
.song h3{font-size:20px;min-width:0}
.song .meta{grid-column:1;min-width:0;overflow-wrap:anywhere}
.song .go{grid-row:1/3;grid-column:2;align-self:center;color:var(--wipe);font-size:20px}

/* Song header */
.tabs{display:flex;gap:4px;background:var(--panel);padding:4px;border-radius:999px;width:fit-content;max-width:100%}
.tabs button{padding:6px 14px;color:var(--dim);border-radius:999px;min-height:36px;font-size:15px}
.tabs button[aria-selected="true"]{color:var(--on-accent);background:var(--wipe);font-weight:600}
.songhead{display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap}
.songhead .ti{min-width:0;display:flex;flex-direction:column}
.songhead h1{font-size:22px;overflow-wrap:anywhere}

/* Sing screen: fills the window; only the lyric list scrolls */
.app.singmode{max-width:1180px;height:100vh;height:100dvh;overflow:hidden;gap:10px;padding-block:10px calc(62px + env(safe-area-inset-bottom,0px))}
#body{min-width:0}
.singmode #body{flex:1;min-height:0}
.sing{height:100%;display:flex;flex-direction:column;gap:10px;min-height:0}
.side{display:flex;flex-direction:column;gap:10px;flex:none;min-width:0}
.video{aspect-ratio:16/9;width:100%;max-width:100%;background:#000;border-radius:var(--r);overflow:hidden}
.video iframe,.video #ythost{display:block;width:100%;height:100%;border:0}
.play{display:grid;grid-template-columns:1fr 2fr 1fr;gap:8px}
.pills{display:flex;flex-wrap:wrap;gap:6px;align-items:center}
.pills .btn{min-height:36px;padding:5px 12px;font-size:14px}
.opt{display:flex;align-items:center;gap:6px;font-size:13px;color:var(--dim)}
.opt select{font-size:14px}
.delay{display:flex;align-items:center;gap:4px;background:var(--raised);border-radius:999px;padding:2px 4px 2px 10px;font-size:13px;color:var(--dim);font-variant-numeric:tabular-nums}
.delay button{width:32px;height:32px;border-radius:50%;background:var(--edge);color:var(--ink);font-size:17px;line-height:1}
.turnwrap{display:flex;align-items:center;gap:8px}
.turn{flex:1;height:5px;border-radius:3px;background:var(--raised);overflow:hidden}
.turn i{display:block;height:100%;width:0;background:var(--hot)}
#turnlabel{font-size:13px;color:var(--hot);font-weight:600;min-width:64px;text-align:right}
.lyrics{position:relative;flex:1;min-height:0;overflow-y:auto;overscroll-behavior:contain;background:var(--panel);border-radius:var(--r);padding:8px}
.nolist{overflow:visible}
.line{padding:9px 12px;border-radius:10px;cursor:pointer;display:flex;flex-direction:column;gap:2px;color:var(--dim);transition:background .15s}
.line:hover{background:var(--raised)}
.line .kr{font-family:var(--lyric);font-size:17px;overflow-wrap:anywhere}
.line .tr{font-size:14px;color:var(--dim);overflow-wrap:anywhere}
.notr .tr{display:none}
.line.active{background:var(--raised);color:var(--ink)}
.line.active .kr{font-size:clamp(21px,5.6vw,27px);font-weight:var(--lyric-w,700);line-height:1.45}
.line.active .tr{color:var(--ink);font-size:15px}
.w{font:inherit;color:inherit;border-radius:4px;display:inline}
.line.active .w:hover{background:rgba(255,183,77,.18)}
.detail{display:flex;flex-direction:column;gap:4px;padding-top:6px;margin-top:6px;border-top:1px solid var(--edge)}
.detail .surf{font-size:19px;font-weight:600}
.detail .surf b{color:var(--hot);font-weight:600}
.detail .rom{color:var(--dim);font-size:14px}
.rules{display:flex;flex-direction:column;gap:2px;font-size:13px;color:var(--dim)}
.rules b{color:var(--ink);font-weight:600}
@media (min-width:900px){
  .sing{display:grid;grid-template-columns:minmax(0,440px) minmax(0,1fr);gap:16px}
  .lyrics{height:100%}
  .line{display:grid;grid-template-columns:minmax(0,1.1fr) minmax(0,1fr);gap:16px;align-items:center}
  .notr .line{grid-template-columns:minmax(0,1fr)}
  .detail{grid-column:1/-1}
}

/* Words */
.wlist{display:flex;flex-direction:column;gap:2px}
.wrow{display:grid;grid-template-columns:1fr auto;gap:8px;align-items:center;padding:8px 12px;background:var(--panel);border-radius:10px}
.wrow>button:first-child{text-align:left;min-width:0}
.wrow .ko{font-size:18px;font-weight:600;font-family:var(--lyric)}
.wrow .gl{display:block;color:var(--dim);font-size:14px;overflow-wrap:anywhere}
.add{min-width:60px;min-height:36px;padding:4px 10px;border-radius:999px;background:var(--raised);font-size:14px}
.add[disabled]{color:var(--good);background:none;cursor:default}

/* Review and gap fill */
#clipdock{max-width:720px;margin:12px auto 0;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.card{padding:26px 16px;background:var(--panel);border-radius:var(--r);text-align:center;display:flex;flex-direction:column;gap:12px;min-width:0}
.card .big{font-family:var(--lyric);font-weight:700;font-size:36px;line-height:1.25;overflow-wrap:anywhere}
.card .ctx{color:var(--dim);overflow-wrap:anywhere;font-family:var(--lyric)}
.card .ctx mark{background:none;color:var(--wipe);font-weight:700}
.rate{display:grid;grid-template-columns:repeat(4,1fr);gap:6px}
.rate button{padding:8px 2px;border-radius:12px;background:var(--raised);min-height:56px;font-size:14px;display:flex;flex-direction:column;align-items:center;justify-content:center}
.rate button:hover{background:var(--edge)}
.rate small{color:var(--dim);font-variant-numeric:tabular-nums}
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;text-align:center}
.stats div{display:flex;flex-direction:column}
.stats b{font-family:var(--display);font-weight:700;font-size:25px;font-variant-numeric:tabular-nums}
.stats span{font-size:13px;color:var(--dim)}
.opts{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.opts button{padding:12px 6px;border-radius:12px;background:var(--raised);font-size:18px;min-height:52px;overflow-wrap:anywhere;font-family:var(--lyric)}
.opts button.ok{color:var(--good);box-shadow:inset 0 0 0 2px var(--good)}
.opts button.no{color:var(--bad);box-shadow:inset 0 0 0 2px var(--bad)}
.blank{color:var(--wipe);border-bottom:3px solid var(--wipe);padding:0 10px}
.score{font-family:var(--display);font-weight:700;font-size:88px;line-height:1;color:var(--wipe);font-variant-numeric:tabular-nums}
.score small{font-size:32px}

/* Find */
.vids{display:flex;flex-direction:column;gap:4px}
.vid{display:grid;grid-template-columns:120px 1fr;gap:12px;align-items:center;padding:8px;border-radius:12px;text-align:left;width:100%}
button.vid:hover{background:var(--panel)}
.vid.static{padding:0}
.vid img{width:120px;aspect-ratio:16/9;object-fit:cover;border-radius:8px;display:block}
.vt{display:flex;flex-direction:column;min-width:0;overflow-wrap:anywhere}
.vt b{font-weight:600}
#found{display:flex;flex-direction:column;gap:10px}
.sheetlist{display:flex;flex-direction:column;gap:2px}
.sheetlist button{display:block;width:100%;padding:10px 12px;text-align:left;border-radius:10px;background:var(--panel);color:var(--dim);overflow-wrap:anywhere}
.sheetlist button:hover{color:var(--ink)}

/* Settings */
.fonts{display:flex;flex-direction:column;gap:6px}
.fonts button{display:flex;flex-direction:column;gap:2px;padding:10px 14px;border-radius:12px;background:var(--panel);text-align:left}
.fonts button[aria-pressed="true"]{box-shadow:inset 0 0 0 2px var(--wipe)}
.fonts .sample{font-size:22px;overflow-wrap:anywhere}
.keys{display:grid;grid-template-columns:auto 1fr;gap:4px 12px;font-size:14px;color:var(--dim)}
.keys kbd{font:inherit;color:var(--ink)}

/* Chrome */
nav.bar{position:fixed;left:0;right:0;bottom:0;z-index:5;display:grid;grid-template-columns:repeat(3,1fr);background:rgba(30,18,20,.92);backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);border-top:1px solid var(--edge);padding-bottom:env(safe-area-inset-bottom,0px);padding-left:env(safe-area-inset-left,0px);padding-right:env(safe-area-inset-right,0px)}
nav.bar button{padding:12px 4px;color:var(--dim);font-size:15px;min-height:50px}
nav.bar button[aria-current="true"]{color:var(--wipe);font-weight:600}
.badge{display:inline-block;min-width:20px;padding:0 5px;margin-left:4px;border-radius:10px;background:var(--hot);color:var(--on-accent);font-size:13px;font-weight:600}
#veil{position:fixed;inset:0;background:rgba(15,8,9,.6);z-index:9}
#sheet{position:fixed;left:0;right:0;bottom:0;z-index:10;max-height:85%;overflow:auto;background:var(--panel);border-radius:20px 20px 0 0;padding-block:20px calc(20px + env(safe-area-inset-bottom,0px));padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
#sheet .in{max-width:640px;margin:0 auto;display:flex;flex-direction:column;gap:10px}
#toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(66px + env(safe-area-inset-bottom,0px));z-index:12;width:min(92%,480px);padding:10px 14px;background:var(--ink);color:var(--on-accent);border-radius:12px;font-size:14px}
#markbar{position:fixed;left:0;right:0;bottom:0;z-index:8;background:var(--panel);border-radius:20px 20px 0 0;padding-block:14px calc(14px + env(safe-area-inset-bottom,0px));padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
#markbar .in{max-width:640px;margin:0 auto;display:flex;flex-direction:column;gap:8px}
.markline{font-family:var(--lyric);font-weight:700;font-size:22px;overflow-wrap:anywhere}
</style>
</head>
<body>
<div id="clipdock" hidden><div class="video"><div id="cliphost"></div></div></div>
<div class="app" id="app"></div>
<nav class="bar" id="bar" aria-label="Main"></nav>
<div id="markbar" hidden></div>
<div id="veil" hidden></div>
<div id="sheet" role="dialog" aria-modal="true" aria-label="Details" hidden></div>
<div id="toast" role="status" hidden></div>
<script>

// Korean pronunciation engine: applies the standard sound-change rules to written Hangul.
const CH='ㄱㄲㄴㄷㄸㄹㅁㅂㅃㅅㅆㅇㅈㅉㅊㅋㅌㅍㅎ'.split('');
const JU='ㅏㅐㅑㅒㅓㅔㅕㅖㅗㅘㅙㅚㅛㅜㅝㅞㅟㅠㅡㅢㅣ'.split('');
const JO=['','ㄱ','ㄲ','ㄳ','ㄴ','ㄵ','ㄶ','ㄷ','ㄹ','ㄺ','ㄻ','ㄼ','ㄽ','ㄾ','ㄿ','ㅀ','ㅁ','ㅂ','ㅄ','ㅅ','ㅆ','ㅇ','ㅈ','ㅊ','ㅋ','ㅌ','ㅍ','ㅎ'];
const SPLIT={ㄳ:'ㄱㅅ',ㄵ:'ㄴㅈ',ㄶ:'ㄴㅎ',ㄺ:'ㄹㄱ',ㄻ:'ㄹㅁ',ㄼ:'ㄹㅂ',ㄽ:'ㄹㅅ',ㄾ:'ㄹㅌ',ㄿ:'ㄹㅍ',ㅀ:'ㄹㅎ',ㅄ:'ㅂㅅ'};
const REDUCE={ㄱ:'ㄱ',ㄲ:'ㄱ',ㅋ:'ㄱ',ㄳ:'ㄱ',ㄺ:'ㄱ',ㄷ:'ㄷ',ㅅ:'ㄷ',ㅆ:'ㄷ',ㅈ:'ㄷ',ㅊ:'ㄷ',ㅌ:'ㄷ',ㅎ:'ㄷ',ㅂ:'ㅂ',ㅍ:'ㅂ',ㅄ:'ㅂ',ㄿ:'ㅂ',ㄴ:'ㄴ',ㄵ:'ㄴ',ㄶ:'ㄴ',ㄹ:'ㄹ',ㄼ:'ㄹ',ㄽ:'ㄹ',ㄾ:'ㄹ',ㅀ:'ㄹ',ㄻ:'ㅁ',ㅁ:'ㅁ',ㅇ:'ㅇ','':''};
const TENSE={ㄱ:'ㄲ',ㄷ:'ㄸ',ㅂ:'ㅃ',ㅅ:'ㅆ',ㅈ:'ㅉ'};
const ROM_C={ㄱ:'g',ㄲ:'kk',ㄴ:'n',ㄷ:'d',ㄸ:'tt',ㄹ:'r',ㅁ:'m',ㅂ:'b',ㅃ:'pp',ㅅ:'s',ㅆ:'ss',ㅇ:'',ㅈ:'j',ㅉ:'jj',ㅊ:'ch',ㅋ:'k',ㅌ:'t',ㅍ:'p',ㅎ:'h'};
const ROM_V={ㅏ:'a',ㅐ:'ae',ㅑ:'ya',ㅒ:'yae',ㅓ:'eo',ㅔ:'e',ㅕ:'yeo',ㅖ:'ye',ㅗ:'o',ㅘ:'wa',ㅙ:'wae',ㅚ:'oe',ㅛ:'yo',ㅜ:'u',ㅝ:'wo',ㅞ:'we',ㅟ:'wi',ㅠ:'yu',ㅡ:'eu',ㅢ:'ui',ㅣ:'i'};
const ROM_F={'':'',ㄱ:'k',ㄴ:'n',ㄷ:'t',ㄹ:'l',ㅁ:'m',ㅂ:'p',ㅇ:'ng'};
const RULES={
  link:['Linking','A final consonant moves onto the next vowel.'],
  nasal:['Nasalization','ㄱ ㄷ ㅂ turn into ㅇ ㄴ ㅁ before ㄴ or ㅁ.'],
  tense:['Tensing','A plain consonant hardens after a stopped final sound.'],
  asp:['Aspiration','ㅎ next to ㄱ ㄷ ㅂ ㅈ makes a breathy ㅋ ㅌ ㅍ ㅊ.'],
  lat:['ㄹ assimilation','ㄴ next to ㄹ becomes ㄹ.'],
  pal:['Palatalization','ㄷ ㅌ before 이 sound like ㅈ ㅊ.'],
  fin:['Final sound','A final consonant is cut short to one of seven sounds.'],
  hdrop:['Silent ㅎ','A final ㅎ disappears before a vowel.'],
  vow:['Vowel ㅢ','After a consonant, ㅢ is said as ㅣ.']
};
// Words the rules can't predict. [written word, syllable offset, spoken first consonant]
const EXCEPT=[['발병',1,'ㅃ']];
const TENSE_AFTER_L=/^[거것게걸수]/;

function hangul(ch){const n=ch.charCodeAt(0)-0xAC00;return n>=0&&n<11172}
function parts(ch){const n=ch.charCodeAt(0)-0xAC00;return{c:CH[Math.floor(n/588)],v:JU[Math.floor(n%588/28)],f:JO[n%28]}}
function build(p){return String.fromCharCode(0xAC00+(CH.indexOf(p.c)*21+JU.indexOf(p.v))*28+JO.indexOf(p.f))}

function analyze(text){
  const out=[...text].map(ch=>hangul(ch)?{o:ch,...parts(ch),tags:[]}:{o:ch,other:true,tags:[]});
  const tag=(s,t)=>{if(!s.tags.includes(t))s.tags.push(t)};
  for(let i=0;i<out.length;i++){
    const a=out[i];
    if(a.other)continue;
    if(a.c!=='ㅇ'&&a.v==='ㅢ'){a.v='ㅣ';tag(a,'vow')}
    if(!a.f)continue;
    let j=i+1,gap=false;
    while(out[j]&&out[j].o===' '){gap=true;j++}
    const b=out[j]&&!out[j].other?out[j]:null;
    const f0=a.f;
    const setF=(f,t)=>{a.f=f;if(t)tag(a,t)};
    if(!b){setF(REDUCE[f0],REDUCE[f0]!==f0?'fin':null);continue}

    // Final ㅎ family
    if(!gap&&(f0==='ㅎ'||f0==='ㄶ'||f0==='ㅀ')){
      const rest=f0==='ㅎ'?'':SPLIT[f0][0];
      if('ㄱㄷㅈ'.includes(b.c)){b.c={ㄱ:'ㅋ',ㄷ:'ㅌ',ㅈ:'ㅊ'}[b.c];setF(rest);tag(b,'asp');tag(a,'asp');continue}
      if(b.c==='ㅅ'){b.c='ㅆ';setF(rest);tag(b,'tense');continue}
      if(b.c==='ㅇ'){
        if(rest){b.c=rest;setF('');tag(b,'link');tag(a,'link')}else{setF('');tag(a,'hdrop')}
        continue
      }
      if(b.c==='ㄴ'){
        if(f0==='ㅎ')setF('ㄴ','nasal');
        else if(f0==='ㅀ'){setF('ㄹ');b.c='ㄹ';tag(b,'lat')}
        else setF('ㄴ');
        continue
      }
    }

    const r=(a.o==='밟')?'ㅂ':REDUCE[f0];

    // Stopped final + ㅎ
    if(!gap&&b.c==='ㅎ'&&'ㄱㄷㅂ'.includes(r)&&f0!=='ㅎ'){
      let keep='';
      if(SPLIT[f0]&&SPLIT[f0][0]==='ㄹ')keep='ㄹ';
      if(SPLIT[f0]&&SPLIT[f0][0]==='ㄴ')keep='ㄴ';
      b.c=r==='ㄱ'?'ㅋ':r==='ㅂ'?'ㅍ':(b.v==='ㅣ'||'ㅈㅊ'.includes(f0))?'ㅊ':'ㅌ';
      setF(keep);tag(b,'asp');tag(a,'asp');continue
    }

    // Next syllable starts with a vowel
    if(b.c==='ㅇ'){
      if(f0==='ㅇ')continue;
      if(gap){
        if(r){b.c=r;setF('');tag(b,'link');tag(a,'link')}
        continue
      }
      if(b.v==='ㅣ'&&(f0==='ㄷ'||f0==='ㅌ'||f0==='ㄾ')){
        b.c=f0==='ㄷ'?'ㅈ':'ㅊ';setF(f0==='ㄾ'?'ㄹ':'');tag(b,'pal');tag(a,'pal');continue
      }
      if(SPLIT[f0]){
        const [x,y]=SPLIT[f0];

      }
      b.c=f0;setF('');tag(b,'link');tag(a,'link');continue
    }

    // Next syllable starts with a consonant
    let f=r;
    if(f0==='ㄺ'&&b.c==='ㄱ'&&!gap)f='ㄹ';
    if('ㄱㄷㅂ'.includes(r)){
      if(b.c==='ㄴ'||b.c==='ㅁ'){f={ㄱ:'ㅇ',ㄷ:'ㄴ',ㅂ:'ㅁ'}[r];tag(a,'nasal')}
      else if(b.c==='ㄹ'&&!gap){f={ㄱ:'ㅇ',ㄷ:'ㄴ',ㅂ:'ㅁ'}[r];b.c='ㄴ';tag(a,'nasal');tag(b,'nasal')}
      else if(!gap&&TENSE[b.c]){b.c=TENSE[b.c];tag(b,'tense')}
    }else if(!gap&&(r==='ㅁ'||r==='ㅇ')&&b.c==='ㄹ'){b.c='ㄴ';tag(b,'nasal')}
    else if(!gap&&r==='ㄴ'&&b.c==='ㄹ'){f='ㄹ';tag(a,'lat')}
    else if(!gap&&r==='ㄹ'&&b.c==='ㄴ'){b.c='ㄹ';tag(b,'lat')}
    if(!gap&&(f0==='ㄵ'||f0==='ㄻ'||f0==='ㄼ'||f0==='ㄾ')&&TENSE[b.c]){b.c=TENSE[b.c];tag(b,'tense')}
    if(gap&&r==='ㄹ'&&f0==='ㄹ'&&TENSE[b.c]){
      const word=text.slice(j).split(' ')[0];
      if(TENSE_AFTER_L.test(word)){b.c=TENSE[b.c];tag(b,'tense')}
    }
    if(f!==f0&&!a.tags.length)tag(a,'fin');
    a.f=f;
  }
  for(const [w,off,c] of EXCEPT){
    let at=text.indexOf(w);
    while(at>=0){const s=out[at+off];if(s&&!s.other){s.c=c;tag(s,'tense')}at=text.indexOf(w,at+1)}
  }
  return out.map(s=>{
    if(s.other)return{o:s.o,s:s.o,tags:[],changed:false};
    const sp=build(s);
    return{o:s.o,s:sp,c:s.c,v:s.v,f:s.f,tags:s.tags,changed:sp!==s.o};
  });
}

function roman(text){
  const a=analyze(text);let r='';
  a.forEach((s,i)=>{
    if(s.c===undefined){r+=s.o;return}
    const prev=a[i-1];
    r+=(s.c==='ㄹ'&&prev&&prev.f==='ㄹ')?'l':ROM_C[s.c];
    r+=ROM_V[s.v]+ROM_F[s.f];
  });

}

  text.split(/\r?\n/).forEach(raw=>{

      timed=true;

    else if(raw.trim())out.push({ko:raw.trim()});
  });
  return{lines:out,timed};

let hold=null,guard=null,turnOn=false,clockOn=false;

  const s=segment(view.song,i);if(!s)return;

  if(play){yt.setPlaybackRate(prefs.speed);yt.playVideo()}

  let t,state;
  try{t=yt.getCurrentTime()||0;state=yt.getPlayerState()}catch(e){return}
  if(guard){
    if(Math.abs(t-guard.t)<1.5||performance.now()>guard.until)guard=null;
    else return;
  }
  setPlayBtn(state===1||turnOn);
  if(hold){
    const s=segment(view.song,hold.i);
    if(!hold.busy&&s){
      if(t<s[0]-1||t>s[1]+1)hold=null; // the viewer scrubbed away: stop holding this line
      else if(state===1&&t>=s[1]-.05){holdEnd();return}
    }
  }
  const i=hold?hold.i:lineAt(t);
  if(i!==view.line){view.line=i;markActive()}
  const s=segment(view.song,view.line);
  if(s)fill((t-s[0])/(s[1]-s[0]));

  if(prefs.mode==='song'&&h.i<song.lines.length-1){h.i++;view.line=h.i;markActive();seekLine(h.i,true);return}

}
function cancelTurn(){

/* Speech and playback */
let run=0,raf=0;
function koVoice(){
  if(!window.speechSynthesis)return null;
  const vs=speechSynthesis.getVoices();
  if(!vs.length)return undefined;
  return vs.find(v=>/^ko/i.test(v.lang))||null;
}
function tts(text,rate,onstart){
  return new Promise(res=>{
    if(!window.speechSynthesis){onstart&&onstart();res(false);return}
    speechSynthesis.cancel();
    const u=new SpeechSynthesisUtterance(text);
    u.lang='ko-KR';u.rate=rate;
    const v=koVoice();if(v)u.voice=v;
    let done=false;
    const fin=ok=>{if(done)return;done=true;clearTimeout(w);res(ok)};
    const w=setTimeout(()=>fin(true),[...text].length*400/rate+4000);
    u.onstart=()=>onstart&&onstart();
    u.onend=()=>fin(true);u.onerror=()=>fin(false);
    speechSynthesis.speak(u);
  });
}
function speakOnce(text,rate=.8){
  if(koVoice()===null)toast('This device has no Korean voice. Add one in your system language settings.');
  stopAll();tts(text,rate);
}
function stopAll(){
  run++;cancelAnimationFrame(raf);hold=null;turnOn=false;
  if(window.speechSynthesis)speechSynthesis.cancel();
  if(ytOK()&&yt.pauseVideo)try{yt.pauseVideo()}catch(e){}
  releaseWake();setPlayBtn(false);
  const t=$('#turnlabel');if(t)t.textContent='';
  const b=$('#turnbar');if(b)b.style.width='0';
}
function setPlayBtn(on){const b=$('#play');if(b&&(b.dataset.on==='1')!==on){b.textContent=on?'Stop':'Play';b.dataset.on=on?'1':''}}
function fill(k){
  const sy=[...document.querySelectorAll('#lyrics .line.active .sy')],n=Math.ceil(Math.max(0,Math.min(1,k))*sy.length);
  sy.forEach((s,i)=>s.classList.toggle('on',i<n));
}
function wipeOver(dur,id){
  const start=performance.now();
  const step=t=>{if(id!==run)return;const k=(t-start)/(dur*1000);fill(k);if(k<1)raf=requestAnimationFrame(step)};
  raf=requestAnimationFrame(step);
}
function sayLine(song,i,id){
  const ko=song.lines[i].ko,rate=prefs.speed;
  const est=[...ko.replace(/\s/g,'')].length*.2/rate+.3;
  const t0=performance.now();
  return tts(ko,rate,()=>wipeOver(est,id)).then(()=>{
    if(id===run)fill(1);
    return Math.max(1,(performance.now()-t0)/1000);
  });
}
function yourTurn(dur,id){
  return new Promise(res=>{
    const bar=$('#turnbar'),lab=$('#turnlabel');
    if(lab)lab.textContent='Your turn';
    const start=performance.now(),len=dur*1200;
    const step=t=>{
      if(id!==run){res();return}
      const k=Math.min(1,(t-start)/len);
      if(bar)bar.style.width=(k*100)+'%';
      if(k<1)raf=requestAnimationFrame(step);
      else{if(bar)bar.style.width='0';if(lab)lab.textContent='';res()}
    };
    raf=requestAnimationFrame(step);
  });
}
let wake=null;
function holdWake(){try{navigator.wakeLock&&navigator.wakeLock.request('screen').then(w=>wake=w).catch(()=>{})}catch(e){}}
function releaseWake(){try{wake&&wake.release()}catch(e){}wake=null}
async function playSeq(){
  const song=getSong(view.song),a=att(song.id);
  if(prefs.mode!=='one')holdWake();
  if(videoActive()){
    hold=(prefs.mode==='song'&&!prefs.shadow)?null:{i:view.line};
    seekLine(view.line,true);
    return;
  }
  if(prefs.voice==='video'&&a&&a.yt)toast(ytOK()?'Mark the lines first so the video can follow them. Using the computer voice for now.':'The video is still loading. Using the computer voice for now.');
  else if(koVoice()===null)toast('This device has no Korean voice. Add one in your system language settings, or attach a video.');
  const id=++run;setPlayBtn(true);
  for(;;){
    const dur=await sayLine(song,view.line,id);
    if(id!==run)return;
    if(prefs.shadow){await yourTurn(dur,id);if(id!==run)return}
    if(prefs.mode==='loop')continue;
    if(prefs.mode==='song'&&view.line<song.lines.length-1){view.line++;markActive();continue}
    break;
  }
  setPlayBtn(false);releaseWake();
}

/* Deck */
const cardKey=(song,base)=>song+'|'+base;
function addCard(song,li,wi){
  const l=song.lines[li],w=words(l)[wi],g=(l.g&&l.g[wi])||[w,''];
  const key=cardKey(song.id,g[0]);
  if(P.deck[key])return false;
  P.deck[key]={key,ko:g[0],form:w,en:g[1]||'',song:song.id,title:song.title,line:l.ko,ef:2.5,int:0,rep:0,due:Date.now()};
  return true;
}
function has(song,li,wi){const l=song.lines[li],w=words(l)[wi],g=(l.g&&l.g[wi])||[w];return !!P.deck[cardKey(song.id,g[0])]}
function schedule(c,q){
  const n={...c};
  if(q===0){n.rep=0;n.int=0;n.ef=Math.max(1.3,c.ef-.2);n.due=Date.now()+10*60*1000;return n}
  n.ef=Math.max(1.3,c.ef+[0,-.15,0,.15][q]);
  let d;
  if(c.rep===0)d=q===3?4:1;
  else if(c.rep===1)d=q===1?3:q===3?8:6;
  else d=Math.round(c.int*(q===1?1.2:q===3?c.ef*1.3:c.ef));
  n.rep=c.rep+1;n.int=d;n.due=Date.now()+d*DAY;return n;
}
const ivl=(c,q)=>{const n=schedule(c,q);return q===0?'10m':n.int+'d'};
function tick(){
  const today=dayKey();
  if(P.lastDay===today){P.done++;return}
  P.streak=P.lastDay===dayKey(Date.now()-DAY)?P.streak+1:1;
  P.lastDay=today;P.done=1;
}

function applyGloss(s,text){
  const a=text.indexOf('['),b=text.lastIndexOf(']');
  if(a<0||b<a)throw 0;
  const res=JSON.parse(text.slice(a,b+1));

  uniq.forEach((ko,i)=>{

  });
  s.lines=s.lines.map(l=>({...l,en:map[l.ko].en,...(map[l.ko].g?{g:map[l.ko].g}:{})}));

/* Gap fill */
let gap=null;
function newGap(s){
  const pool=[...new Set(s.lines.flatMap(words))].filter(w=>hasKo(w)&&[...w].length>=2);
  const lines=[...new Map(s.lines.filter(l=>hasKo(l.ko)).map(l=>[l.ko,l])).values()].sort(()=>Math.random()-.5).slice(0,8);
  const qs=lines.map(l=>{
    const ws=words(l),cand=ws.filter(w=>hasKo(w)&&[...w].length>=2);
    const pick=cand[Math.floor(Math.random()*cand.length)]||ws[0];
    const others=pool.filter(w=>w!==pick).sort(()=>Math.random()-.5).slice(0,3);
    return{l,pick,opts:[pick,...others].sort(()=>Math.random()-.5)};
  }).filter(q=>q.opts.length>=2);
  gap={song:s.id,qs,i:0,right:0,picked:null};
}
function gapTab(s){
  if(!gap||gap.song!==s.id)newGap(s);
  const b=$('#body');
  if(!gap.qs.length){b.innerHTML='<p class="muted">This song needs more words for a gap fill.</p>';return}
  if(gap.i>=gap.qs.length){
    const pct=Math.round(gap.right/gap.qs.length*100);
    b.innerHTML=`<div class="card"><p class="muted">점수</p><div class="score">${pct}<small>점</small></div><p>${gap.right} of ${gap.qs.length} gaps correct</p><div class="row" style="justify-content:center"><button class="btn primary" data-gapagain="1">Sing it again</button></div></div>`;
    return;
  }
  const q=gap.qs[gap.i],at=q.l.ko.indexOf(q.pick);
  const x=q.l.ko.slice(0,at),y=q.l.ko.slice(at+q.pick.length);
  const fillIn=gap.picked!=null?`<span style="color:var(--wipe)">${esc(q.pick)}</span>`:'<span class="blank">　　</span>';
  b.innerHTML=`<div class="card"><div class="muted">Gap ${gap.i+1} of ${gap.qs.length}</div>
   <div class="kara" style="font-size:clamp(22px,6vw,32px)" lang="ko">${esc(x)}${fillIn}${esc(y)}</div>
   ${q.l.en?`<p class="muted">${esc(q.l.en)}</p>`:''}
   <div class="row" style="justify-content:center"><button class="btn" data-speak="${esc(q.l.ko)}">Listen to the line</button></div>
   <div class="opts">${q.opts.map(o=>{
     let c='';if(gap.picked!=null){if(o===q.pick)c='ok';else if(o===gap.picked)c='no'}
     return `<button lang="ko" class="${c}" data-opt="${esc(o)}"${gap.picked!=null?' disabled':''}>${esc(o)}</button>`}).join('')}</div>
   ${gap.picked!=null?`<div class="row" style="justify-content:center"><button class="btn primary" data-gapnext="1">Next</button></div>`:''}</div>`;
}

/* Review */
let rv={card:null,show:false,sounds:false};
function review(){
  const due=dueCards(),total=Object.keys(P.deck).length,today=P.lastDay===dayKey()?P.done:0;
  const stats=`<div class="stats"><div><b>${P.lastDay===dayKey()||P.lastDay===dayKey(Date.now()-DAY)?P.streak:0}</b><span>day streak</span></div><div><b>${today}/${P.goal}</b><span>today's goal</span></div><div><b>${total}</b><span>words saved</span></div></div>`;
  if(!due.length){
    $('#app').innerHTML=`<header class="top"><h1>Review</h1></header>${stats}
    <div class="card"><div class="big">${total?'All done':'No words yet'}</div><p class="ctx">${total?'Your next words come back on schedule.':'Open a song and add words from the Words tab.'}</p>
    <div class="row" style="justify-content:center"><button class="btn primary" data-nav="home">Go to songs</button></div></div>`;
    return;
  }
  const c=due[0];
  if(!rv.card||rv.card.key!==c.key){rv={card:c,show:false,sounds:false};hideClip()}
  const ctx=esc(c.line).replace(esc(c.form),`<mark>${esc(c.form)}</mark>`);
  $('#app').innerHTML=`<header class="top"><h1>Review</h1><span class="muted">${due.length} due</span></header>${stats}
  <div class="card"><div class="big" lang="ko">${esc(c.ko)}</div><p class="ctx" lang="ko">${ctx}</p>
   <div class="row" style="justify-content:center"><button class="btn" data-speak="${esc(c.ko)}">Hear it</button>${clipFor(c)?'<button class="btn primary" data-clip="1">Hear the singer</button>':''}<button class="btn" data-speak="${esc(c.line)}">Computer voice</button><button class="btn" data-rvsound="1" aria-pressed="${rv.sounds}">Sounds</button></div>
   ${rv.sounds?`<p lang="ko"><b style="color:var(--hot)">[${esc(spoken(c.form))}]</b> <span class="muted">${esc(roman(c.form))}</span></p>`:''}
   ${rv.show?`<p style="font-size:19px">${c.en?esc(c.en):'<span class="muted">No meaning saved.</span>'}</p><p class="muted">from ${esc(c.title)}</p>`:''}</div>
  ${rv.show?`<div class="rate">${['Again','Hard','Good','Easy'].map((l,q)=>`<button data-rate="${q}">${l}<small>${ivl(c,q)}</small></button>`).join('')}</div>`:
   `<button class="btn primary" data-reveal="1">Show meaning</button>`}`;
}

/* Find a song */
let results={title:'',items:[],lists:null};
function vidRows(items){
  return items.length?`<div class="vids">${items.map(v=>`<button class="vid" data-pick="${esc(v.id)}" data-title="${esc(v.title)}" data-channel="${esc(v.channel)}">${v.thumb?`<img src="${esc(v.thumb)}" alt="" loading="lazy">`:'<span></span>'}<span class="vt"><b>${esc(v.title)}</b><span class="muted">${esc(v.channel)}</span></span></button>`).join('')}</div>`:'<p class="muted">Nothing found.</p>';
}
function find(){
  const signed=live();
  $('#app').innerHTML=`<header class="top"><h1>Find a song</h1><button class="link" data-nav="settings">Settings</button></header>
  <form id="linkform" class="row"><input id="link" type="text" aria-label="YouTube link" placeholder="Paste a YouTube link" style="flex:1;min-width:0"><button class="btn primary">Use link</button></form>
  ${signed?`<form id="searchform" class="row"><input id="q" type="text" aria-label="Search YouTube" placeholder="Search YouTube" style="flex:1;min-width:0"><button class="btn">Search</button></form>
   <div class="row"><button class="btn" id="liked">Liked videos</button><button class="btn" id="lists">My playlists</button></div>`
  :`<div class="block"><p class="muted">Connect your YouTube account to search, and to open your playlists and liked videos.</p><div class="row"><button class="btn primary" id="connect">Connect YouTube</button></div></div>`}
  <div id="found">${results.lists?`<h2>${esc(results.title)}</h2><div class="sheetlist">${results.lists.map(l=>`<button data-plist="${esc(l.id)}" data-title="${esc(l.title)}">${esc(l.title)} · ${l.count}</button>`).join('')}</div>`:results.title?`<h2>${esc(results.title)}</h2>${vidRows(results.items)}`:''}</div>
  <div class="block"><p class="muted">No video? You can still paste lyrics and study with the computer voice.</p><div class="row"><button class="btn" data-pick="" data-title="" data-channel="">Paste lyrics only</button></div></div>`;
}
async function load(title,fn){
  const f=$('#found');if(f)f.innerHTML='<p class="muted">Loading…</p>';
  try{const r=await fn();results={title,items:r.items||[],lists:r.lists||null}}
  catch(e){results={title:'',items:[],lists:null};toast(e.message||'That did not load. Try again.')}
  find();
}

/* Song setup */
let draft=null;
function setup(){
  const d=draft;
  $('#app').innerHTML=`<header class="top"><div><button class="link" data-nav="find">← Find</button><h1>Add lyrics</h1></div></header>
  ${d.yt?`<div class="vid static">${d.thumb?`<img src="${esc(d.thumb)}" alt="">`:''}<span class="vt"><b>${esc(d.rawTitle)}</b><span class="muted">${esc(d.channel)}</span></span></div>`:''}
  <label class="field">Song title<input id="ftitle" type="text" value="${esc(d.title)}"></label>
  <label class="field">Artist<input id="fartist" type="text" value="${esc(d.artist)}"></label>
  <div class="row"><button class="btn" id="lookup">Look up lyrics</button><span class="muted" id="lookstate"></span></div>
  <div id="hits"></div>
  <label class="field">Lyrics, one line per row<textarea id="flyrics" lang="ko">${esc(d.lyrics)}</textarea></label>
  <div class="row"><button class="btn primary" id="build">Add song</button><span class="muted" id="buildstate"></span></div>`;
}
async function lookup(){
  const title=$('#ftitle').value.trim(),artist=$('#fartist').value.trim(),st=$('#lookstate'),hits=$('#hits');
  if(!title){st.textContent='Add a song title first.';return}
  st.textContent='Looking…';hits.innerHTML='';
  try{
    const r=await fetch('https://lrclib.net/api/search?q='+encodeURIComponent((artist+' '+title).trim()));
    if(!r.ok)throw 0;
    const rows=(await r.json()).filter(x=>x.syncedLyrics||x.plainLyrics);
    rows.sort((a,b)=>(hasKo(b.syncedLyrics||b.plainLyrics)-hasKo(a.syncedLyrics||a.plainLyrics))||(!!b.syncedLyrics-!!a.syncedLyrics));
    draft.hits=rows.slice(0,6);
    st.textContent=rows.length?'Pick the match. Check that it fits your video.':'No lyrics found. Paste them below.';
    hits.innerHTML=draft.hits.length?`<div class="sheetlist">${draft.hits.map((h,i)=>`<button data-hit="${i}">${esc(h.trackName)} · ${esc(h.artistName)} · ${Math.floor((h.duration||0)/60)}:${String(Math.round((h.duration||0)%60)).padStart(2,'0')} · ${h.syncedLyrics?'timed':'not timed'}${hasKo(h.syncedLyrics||h.plainLyrics)?'':' · not Korean'}</button>`).join('')}</div>`:'';
  }catch(e){st.textContent='The lyrics lookup did not respond. Paste the lyrics below.'}
}
function buildSong(){
  const title=$('#ftitle').value.trim(),artist=$('#fartist').value.trim(),st=$('#buildstate');
  const {lines,timed}=parseLyrics($('#flyrics').value);
  if(!title){st.textContent='Add a song title first.';return}
  if(lines.filter(l=>hasKo(l.ko)).length<2){st.textContent='Paste at least two lines of Korean lyrics.';return}
  if(lines.length>200){st.textContent='Keep it under 200 lines.';return}
  const id='s'+Date.now().toString(36);
  const song={id,title,by:artist,added:Date.now(),lines:lines.map(l=>({ko:l.ko}))};
  if(draft.yt){
    P.att[id]={yt:draft.yt,offset:0};
    if(timed&&lines.every(l=>l.t!=null)){P.att[id].times=lines.map(l=>l.t);P.att[id].ends=lines.map(l=>l.end??null)}
  }
  saveSong(song);
  view={v:'song',song:id,tab:'sing',line:0};render();window.scrollTo(0,0);
}
async function pick(id,raw,channel,thumb){
  const c=cleanTitle(raw);let title=c,artist=channel.replace(/ - Topic$/,'').replace(/VEVO$/,'').trim();
  const m=c.match(/^(.+?)\s+[-–—]\s+(.+)$/);
  if(m){artist=m[1].trim();title=m[2].trim()}
  draft={yt:id,rawTitle:raw,channel,thumb,title,artist,lyrics:'',hits:[]};
  view.v='setup';render();window.scrollTo(0,0);
  if(title)lookup();
}
async function useLink(text){
  const id=videoId(text);
  if(!id){toast('That doesn\'t look like a YouTube link.');return}
  let t='',c='';
  try{const r=await fetch('https://www.youtube.com/oembed?format=json&url='+encodeURIComponent('https://www.youtube.com/watch?v='+id));if(r.ok){const j=await r.json();t=j.title||'';c=j.author_name||''}}catch(e){}
  pick(id,t,c,`https://i.ytimg.com/vi/${id}/mqdefault.jpg`);
}

/* Settings */
const FONTS=[
 {id:'noto',name:'Noto Serif KR',css:'"Noto Serif KR",serif',w:700},
 {id:'gowun',name:'Gowun Batang',css:'"Gowun Batang",serif',w:700},
 {id:'dohyeon',name:'Do Hyeon',css:'"Do Hyeon",sans-serif',w:400},
 {id:'jua',name:'Jua',css:'"Jua",sans-serif',w:400},
 {id:'pen',name:'Nanum Pen Script',css:'"Nanum Pen Script",cursive',w:400}
];
function applyFont(){
  const f=FONTS.find(x=>x.id===prefs.font)||FONTS[0],r=document.documentElement.style;
  r.setProperty('--lyric',f.css);r.setProperty('--lyric-w',f.w);
}
function settings(){
  $('#app').innerHTML=`<header class="top"><div><button class="link" data-nav="home">← Songs</button><h1>Settings</h1></div></header>
  ${CLIENT_ID?'':`<label class="field">Google client ID<input id="cid" type="text" value="${esc(prefs.clientId)}" autocomplete="off"></label>
  <p class="muted">Page address for Google setup: ${esc(location.origin)}</p>`}
  <div class="row"><button class="btn primary" id="connect">${live()?'Connected':'Connect YouTube'}</button>${prefs.connected?'<button class="btn" id="signout">Disconnect</button>':''}</div>
  <p class="muted" id="syncnote">${syncText()}</p>
  <label class="field">Daily goal<input id="goal" type="text" inputmode="numeric" value="${P.goal}"></label>
  <section class="block"><h2>Lyric font</h2><div class="fonts">${FONTS.map(f=>`<button data-font="${esc(f.id)}" aria-pressed="${prefs.font===f.id}"><span class="sample" lang="ko" style="font-family:${esc(f.css)};font-weight:${f.w}">아리랑 고개로 넘어간다</span><span class="muted">${esc(f.name)}</span></button>`).join('')}</div></section>
  <section class="block"><h2>Keyboard shortcuts</h2><div class="keys"><kbd>Space</kbd><span>Play or stop; show the meaning in Review</span><kbd>← →</kbd><span>Previous or next line</span><kbd>1 2 3 4</kbd><span>Again, Hard, Good, Easy in Review</span><kbd>Esc</kbd><span>Close a panel</span></div></section>`;
}

function finishGloss(s){
  if(custom[s.id])saveSong(s);
  closeSheet();prefs.meaning=true;saveLocal();
  if(view.tab==='words')wordsTab(s);else singTab(s);
  toast('Translation added.');
}

/* Marking lines against the video */
let marking=null;
function startMark(){
  if(!ytOK()){toast('The video is still loading. Try again in a moment.');return}
  const s=getSong(view.song);
  stopAll();marking={i:0,times:[]};
  yt.setPlaybackRate(1);yt.seekTo(0,true);yt.playVideo();
  markBar(s);
}
function markBar(s){
  const i=marking.i,el=$('#markbar');
  el.hidden=false;
  el.innerHTML=`<div class="in"><p class="muted">Tap when this line starts · ${i+1} of ${s.lines.length}</p><p class="markline" lang="ko">${esc(s.lines[i].ko)}</p>
  <div class="row"><button class="btn primary" data-markhit="1" style="flex:1">Now</button><button class="btn" data-markstop="1">Cancel</button></div></div>`;
}

/* Events */
document.addEventListener('submit',e=>{
  e.preventDefault();
  if(e.target.id==='linkform')useLink($('#link').value);
  if(e.target.id==='searchform'){const q=$('#q').value.trim();if(q)load('Results for '+q,async()=>({items:await ytSearch(q)}))}
});
document.addEventListener('click',async e=>{
  if(e.target.id==='veil'){closeSheet();return}
  const ln=e.target.closest('.line');
  if(ln){
    const i=+ln.dataset.i,w=e.target.closest('.w');
    if(i===view.line&&w)wordSheet(i,+w.dataset.w);else jump(i);
    return;
  }
  const t=e.target.closest('button');
  if(!t)return;
  const d=t.dataset;
  if(d.nav){stopAll();view={...view,v:d.nav};render();window.scrollTo(0,0);return}
  if(d.open){view={v:'song',song:d.open,tab:'sing',line:0};render();window.scrollTo(0,0);return}
  if(d.tab){stopAll();view.tab=d.tab;songView();return}
  if(t.id==='play'){if(d.on==='1')stopAll();else playSeq();return}
  if(d.step){jump(view.line+ +d.step);return}
  if(d.pref){
    if(d.pref==='meaning'&&!getSong(view.song).lines.some(l=>l.en)){glossSheet(getSong(view.song));return}
    prefs[d.pref]=!prefs[d.pref];t.setAttribute('aria-pressed',prefs[d.pref]);saveLocal();
    $('#lyrics').classList.toggle('notr',!prefs.meaning);
    $('#turnwrap').hidden=!prefs.shadow;
    markActive();return
  }
  if(d.videosheet){videoSheet();return}
  if(d.clip){const c=clipFor(rv.card);if(c)playClip(c);return}
  if(d.font){prefs.font=d.font;saveLocal();applyFont();settings();return}
  if(d.sheet){const [a,b]=d.sheet.split(':').map(Number);wordSheet(a,b);return}
  if(d.speak){speakOnce(d.speak);return}
  if(d.close){closeSheet();return}
  if(d.addw){
    const [a,b]=d.addw.split(':').map(Number),s=getSong(view.song),inp=$('#glossin');
    if(inp&&inp.value.trim()){const l=s.lines[a];l.g=l.g||words(l).map(w=>[w,'']);l.g[b]=[words(l)[b],inp.value.trim()]}
    addCard(s,a,b);if(custom[s.id])saveSong(s);else save();chrome();closeSheet();if(view.tab==='words')wordsTab(s);toast('Added to Review.');return
  }
  if(d.addall){
    const s=getSong(view.song);let n=0;
    s.lines.forEach((l,li)=>words(l).forEach((w,wi)=>{if(hasKo(w)&&addCard(s,li,wi))n++}));
    save();chrome();wordsTab(s);toast(n+' words added to Review.');return
  }
  if(d.gloss){glossSheet(getSong(view.song));return}
  if(d.claude){
    const p=$('#glossprompt').value,q=encodeURIComponent(p);
    let copied=true;
    try{navigator.clipboard.writeText(p).catch(()=>{copied=false;toast('Copying was blocked. Open the Words tab on a computer to copy the request.')})}catch(err){copied=false}
    window.open('https://claude.ai/new'+(q.length<6000?'?q='+q:''),'_blank','noopener');
    toast('Request copied. Paste it in Claude if the chat is empty.');
    return
  }
  if(d.glosspaste){
    const s=getSong(view.song);
    try{
      const text=await navigator.clipboard.readText();
      applyGloss(s,text);finishGloss(s);
    }catch(err){toast('That didn\'t work. Paste Claude\'s reply in the box below.')}
    return
  }
  if(d.glossapply){
    const s=getSong(view.song);
    try{applyGloss(s,$('#glossreply').value);finishGloss(s)}
    catch(err){toast('That reply isn\'t in the expected format. Copy Claude\'s whole reply.')}
    return
  }
  if(d.opt){const q=gap.qs[gap.i];gap.picked=d.opt;if(d.opt===q.pick)gap.right++;gapTab(getSong(view.song));return}
  if(d.gapnext){gap.i++;gap.picked=null;gapTab(getSong(view.song));return}
  if(d.gapagain){gap=null;gapTab(getSong(view.song));return}
  if(d.reveal){rv.show=true;review();return}
  if(d.rvsound){rv.sounds=!rv.sounds;review();return}
  if(d.rate){const c=rv.card;P.deck[c.key]=schedule(c,+d.rate);tick();rv={card:null,show:false,sounds:false};save();chrome();review();return}
  if(t.id==='connect'||t.id==='reconnect'){const c=$('#cid');if(c){prefs.clientId=c.value.trim();saveLocal()}await connect();return}
  if(t.id==='signout'){auth=null;prefs.connected=false;saveLocal();render();return}
  if(t.id==='liked'){load('Liked videos',async()=>({items:await ytLiked()}));return}
  if(t.id==='lists'){load('My playlists',async()=>({lists:await ytPlaylists()}));return}
  if(d.plist){load(d.title,async()=>({items:await ytPlaylist(d.plist)}));return}
  if(d.pick!==undefined){const img=t.querySelector('img');pick(d.pick,d.title,d.channel,img?img.src:'');return}
  if(t.id==='lookup'){lookup();return}
  if(d.hit){const h=draft.hits[+d.hit];$('#flyrics').value=h.syncedLyrics||h.plainLyrics;draft.lyrics=$('#flyrics').value;return}
  if(t.id==='build'){buildSong();return}
  if(d.att==='add'){
    const id=videoId($('#attlink').value);
    if(!id){toast('That doesn\'t look like a YouTube link.');return}
    P.att[view.song]={yt:id,offset:0};save();closeSheet();singTab(getSong(view.song));return
  }
  if(d.att==='remove'){stopAll();delete P.att[view.song];save();closeSheet();singTab(getSong(view.song));return}
  if(d.nudge){const a=att(view.song);a.offset=(a.offset||0)+ +d.nudge;save();$('#offset').textContent=fmtOff(a.offset);return}
  if(t.id==='mark'){closeSheet();startMark();return}
  if(d.markhit){
    const s=getSong(view.song);marking.times[marking.i]=yt.getCurrentTime();view.line=marking.i;markActive();marking.i++;
    if(marking.i>=s.lines.length){
      const a=att(s.id);a.times=marking.times;a.ends=null;a.offset=0;marking=null;$('#markbar').hidden=true;stopAll();save();singTab(s);toast('All lines marked.');
    }else markBar(s);
    return
  }
  if(d.markstop){marking=null;$('#markbar').hidden=true;stopAll();return}
  if(d.del==='ask'){$('#delrow').innerHTML='<span class="muted">Delete this song? Words in Review stay.</span><button class="btn" data-del="yes">Delete</button><button class="btn" data-del="no">Keep</button>';return}
  if(d.del==='no'){songView();return}
  if(d.del==='yes'){stopAll();dropSong(view.song);view={v:'home',song:null,tab:'sing',line:0};render();return}
});
document.addEventListener('change',e=>{
  const id=e.target.id;
  if(id==='speed'){prefs.speed=+e.target.value;saveLocal();if(ytOK())yt.setPlaybackRate(prefs.speed)}
  if(id==='mode'){prefs.mode=e.target.value;saveLocal()}
  if(id==='voice'){prefs.voice=e.target.value;saveLocal()}
  if(id==='cid'){prefs.clientId=e.target.value.trim();saveLocal()}
  if(id==='goal'){const n=parseInt(e.target.value,10);if(n>0){P.goal=n;save()}}
});
document.addEventListener('keydown',e=>{
  if(e.key==='Escape'&&!$('#sheet').hidden){closeSheet();return}
  if(/^(INPUT|TEXTAREA|SELECT)$/.test(e.target.tagName)||!$('#sheet').hidden||e.ctrlKey||e.metaKey||e.altKey)return;
  if(view.v==='song'&&view.tab==='sing'){
    if(e.key===' '){e.preventDefault();$('#play').click()}
    if(e.key==='ArrowLeft'){e.preventDefault();jump(view.line-1)}
    if(e.key==='ArrowRight'){e.preventDefault();jump(view.line+1)}
  }
  if(view.v==='review'){
    if(e.key===' '){const b=$('[data-reveal]');if(b){e.preventDefault();b.click()}}
    if('1234'.includes(e.key)){const b=$(`[data-rate="${+e.key-1}"]`);if(b)b.click()}
  }
});
document.addEventListener('visibilitychange',()=>{if(document.hidden&&live()&&syncState==='syncing')push().catch(pushFail)});
if(window.speechSynthesis)speechSynthesis.onvoiceschanged=()=>koVoice();

loadLocal();applyFont();render();

</script>
